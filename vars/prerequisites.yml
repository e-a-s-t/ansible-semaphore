---
# Disk capacities use decimal GB, matching lsblk --bytes output.
# Memory capacities use binary GiB because Linux reports memory in MiB.
prerequisites_production_requirements:
  control_plane:
    vcpu: 4
    memory_gib: 8
    os_disk_gb: 100
    data_disk_gb: 0
  worker:
    vcpu: 8
    memory_gib: 32
    os_disk_gb: 100
    data_disk_gb: 500
  backup:
    vcpu: 4
    memory_gib: 8
    os_disk_gb: 100
    data_disk_gb: 2000

# Validation mode controls whether post-install runtime requirements are
# applicable. Fresh installation is intentionally non-blocking for components
# that Carekube installs later.
rke2_validation_mode: fresh_install
rke2_allowed_validation_modes:
  - fresh_install
  - existing_install

# A clean-install policy is opt-in. Runtime evidence alone is not enough to
# fail a fresh-install validation.
rke2_clean_install_policy: false

# Linux-visible memory can be slightly lower than provisioned VM memory because
# the kernel and firmware reserve memory. A value of 0.05 permits up to 5%
# below the nominal requirement. This does not verify the hypervisor value.
prerequisites_memory_tolerance: 0.05

# Optional explicit worker/backup disk override. Workers discover suitable
# unused disks automatically when this is empty.
# Example: prerequisites_data_disk_device: /dev/vdc
prerequisites_data_disk_device: ""

# Formatting an automatically selected worker disk is destructive and must be
# explicitly authorized for the preparation playbook.
prerequisites_allow_disk_format: false

# Shared read-only discovery command used by the validator and preparation
# playbook. It deliberately emits tab-separated records for safe parsing.
prerequisites_longhorn_disk_discovery_command: >-
  root_disk=$(findmnt -n -o SOURCE / 2>/dev/null | xargs -r lsblk -s -b -n -o NAME,TYPE,SIZE 2>/dev/null | awk '$2 == "disk" {print $1; exit}');
  swap_devices=$(swapon --show=NAME --noheadings 2>/dev/null);
  lsblk -dnbo PATH,TYPE,SIZE,FSTYPE,MOUNTPOINTS 2>/dev/null | while read -r path type size fstype mountpoint; do
  [ "$type" = disk ] || continue;
  reason=;
  child=$(lsblk -nrpbo NAME,TYPE,PKNAME "$path" 2>/dev/null | awk -v p="$path" '$1 != p {print; exit}');
  signature=$(blkid -p -o value -s TYPE "$path" 2>/dev/null || true);
  if [ "$path" = "$root_disk" ]; then reason=os-disk;
  elif [ -n "$child" ]; then reason=partitions-or-mapped-children;
  elif [ "$mountpoint" != "-" ] && [ -n "$mountpoint" ]; then reason=mounted;
  elif printf '%s\n' "$swap_devices" | awk -v p="$path" '$1 == p {found=1} END {exit !found}'; then reason=swap;
  elif [ -n "$fstype" ] || [ -n "$signature" ]; then reason=existing-filesystem;
  fi;
  if [ -n "$reason" ]; then printf 'REJECT\t%s\t%s\t%s\n' "$path" "$size" "$reason";
  else printf 'UNUSED\t%s\t%s\n' "$path" "$size"; fi;
  done

# Only explicitly configured endpoints are tested. Each item may contain:
# name, host, port, and tls (true/false).
prerequisites_network_endpoints: []

# The Cilium mode is intentionally unset until the installation configuration
# is chosen. Unset mode-specific checks are reported as SKIP.
prerequisites_cilium_routing_mode: ""
prerequisites_cilium_pod_cidr: ""
prerequisites_cilium_service_cidr: ""
prerequisites_cilium_min_kernel: "5.10"

# Longhorn V1 is the default deployment assumed by this validation. V2-only
# kernel and huge-page requirements are not reported unless explicitly chosen.
prerequisites_longhorn_engine: v1
prerequisites_longhorn_data_path: /var/lib/longhorn
prerequisites_longhorn_filesystems:
  - ext4
  - xfs
prerequisites_longhorn_required_utilities:
  - fstrim
  - blkid

# Only these infrastructure checks can make a fresh VM incomplete. Carekube-
# managed installation settings and runtime-only checks never do so.
prerequisites_mandatory_infrastructure_checks:
  - Node role assignment
  - Operating system
  - Architecture
  - CPU
  - Memory
  - OS disk
  - Dedicated role data disk
  - IPv4 address
  - Default route
  - Hostname resolution
  - DNS resolvers
  - Time synchronization

# These settings are useful context but are normally configurable by RKE2.
prerequisites_installation_deferred_settings:
  - br_netfilter module loaded
  - net.bridge.bridge-nf-call-iptables enabled
  - iscsiadm available on workers
