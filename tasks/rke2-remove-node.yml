---
- name: Enforce cluster-wide removal readiness
  ansible.builtin.include_tasks: rke2-remove-barrier.yml

- name: Remove and independently verify this node
  when: not ansible_check_mode
  block:
    - name: Reinspect immediately before mutation
      rke2_remove_inspect:
      register: rke2_remove_current

    - name: Require unchanged ownership and protected storage
      ansible.builtin.assert:
        that:
          - rke2_remove_current.inspection.safe
          - rke2_remove_current.inspection.storage == rke2_remove_before.inspection.storage
        fail_msg: >-
          Removal preconditions changed; refusing cleanup.
          Environment files={{ rke2_remove_current.inspection.environment_diagnostics | default([]) }};
          mounts={{ rke2_remove_current.inspection.mount_diagnostics | default([]) }}

    - name: Stop recognized RKE2 services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      no_log: true
      loop: [rke2-server, rke2-agent]
      when:
        - rke2_remove_current.inspection.present
        - (item ~ '.service') in rke2_remove_current.inspection.remaining

    - name: Initialize current-node runtime cleanup completion
      ansible.builtin.set_fact:
        rke2_remove_runtime_complete: false

    - name: Retry verified official runtime cleanup within the configured bound
      ansible.builtin.include_tasks: rke2-remove-runtime-attempt.yml
      loop: "{{ range(1, rke2_remove_cleanup_attempts + 1) | list }}"
      loop_control:
        loop_var: rke2_remove_attempt
      when:
        - rke2_remove_current.inspection.present
        - not rke2_remove_runtime_complete

    - name: Require no blocking mounts immediately before uninstall
      ansible.builtin.include_tasks: rke2-remove-mount-guard.yml
      when: rke2_remove_current.inspection.present

    - name: Run installed official RKE2 uninstaller
      ansible.builtin.command:
        argv: ["{{ rke2_remove_current.inspection.scripts.uninstall }}"]
      environment:
        RKE2_DATA_DIR: /var/lib/rancher/rke2
        INSTALL_RKE2_ROOT: /usr/local
      when:
        - rke2_remove_current.inspection.present
        - "'uninstall' in rke2_remove_current.inspection.scripts"
      no_log: true

    - name: Recheck no blocking mounts before fallback recursive cleanup
      ansible.builtin.include_tasks: rke2-remove-mount-guard.yml
      when: rke2_remove_current.inspection.present

    - name: Remove only inspected RKE2-owned artifacts and partial installation remnants
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ rke2_remove_current.inspection.cleanup_paths }}"
      when: rke2_remove_current.inspection.present

    - name: Reload systemd after unit removal
      ansible.builtin.systemd_service:
        daemon_reload: true
      no_log: true
      when: rke2_remove_current.inspection.present

  rescue:
    - name: Record cleanup failure without logging script output
      ansible.builtin.set_fact:
        rke2_remove_failed: true

  always:
    - name: Inspect after removal even when uninstall fails
      rke2_remove_inspect:
      register: rke2_remove_after
      failed_when: false
      when: not ansible_check_mode

    - name: Determine verified node result
      ansible.builtin.set_fact:
        rke2_remove_result: >-
          {{ 'INCOMPLETE' if (rke2_remove_failed | default(false)
             or rke2_remove_after.failed | default(false)
             or not rke2_remove_after.inspection.safe | default(false)
             or rke2_remove_after.inspection.present | default(true)
             or rke2_remove_after.inspection.storage | default({}) != rke2_remove_before.inspection.storage)
             else ('REMOVED' if rke2_remove_before.inspection.present else 'ABSENT') }}
      when: not ansible_check_mode

    - name: Report verified removal result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} | {{ 'control_plane' if 'control_plane' in group_names else 'worker' }} | {{ rke2_remove_result }}"
      when: not ansible_check_mode

    - name: Report sanitized environment-file verification failures
      ansible.builtin.debug:
        msg: "{{ rke2_remove_after.inspection.environment_diagnostics | default([]) }}"
      when:
        - not ansible_check_mode
        - rke2_remove_result == 'INCOMPLETE'

    - name: Report sanitized remaining mounts after incomplete cleanup
      ansible.builtin.debug:
        msg:
          runtime_active: "{{ rke2_remove_after.inspection.runtime_active | default('unknown') }}"
          mounts: "{{ rke2_remove_after.inspection.mount_diagnostics | default([]) }}"
      when:
        - not ansible_check_mode
        - rke2_remove_result == 'INCOMPLETE'

    - name: Stop cluster teardown after incomplete cleanup
      ansible.builtin.assert:
        that: rke2_remove_result != 'INCOMPLETE'
        fail_msg: RKE2 cleanup or storage verification failed; later nodes will not be removed.
      when: not ansible_check_mode
