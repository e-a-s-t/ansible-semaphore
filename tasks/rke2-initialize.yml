---
# Capture on an original node, before add_host or delegation changes variable context.
# set_fact materializes the list now; do not recalculate it after host failures.
- name: Capture explicitly targeted inventory RKE2 nodes
  ansible.builtin.set_fact:
    rke2_initial_target_hosts: >-
      {{ (groups['control_plane'] | default([]) | union(groups['worker'] | default([])))
         | intersect(ansible_play_hosts_all)
         | difference(['localhost', '127.0.0.1', '::1']) | sort }}
  run_once: true

- name: Prepare controller-local execution
  ansible.builtin.include_tasks: rke2-controller.yml

- name: Initialize current-run cluster readiness
  ansible.builtin.set_fact:
    rke2_target_hosts: "{{ hostvars[inventory_hostname].rke2_initial_target_hosts }}"
    rke2_source_ready: false
    rke2_token_ready: false
    rke2_bootstrap_complete: false
    rke2_cluster_token: ''
    rke2_selected_source: "{{ rke2_token_source_node | trim if rke2_token_source_node | trim else rke2_bootstrap_node }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true

- name: Reset every targeted host readiness for this run
  ansible.builtin.set_fact:
    rke2_preflight_ready: false
    rke2_installation_complete: false
  delegate_to: "{{ item }}"
  delegate_facts: true
  run_once: true
  loop: "{{ hostvars['localhost'].rke2_target_hosts }}"

