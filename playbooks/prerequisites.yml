---
- name: Validate RKE2 infrastructure prerequisites
  hosts: proxmox2_targets
  gather_facts: false
  become: false
  vars_files:
    - ../vars/prerequisites.yml

  pre_tasks:
    - name: Gather read-only system facts
      ansible.builtin.setup:
      register: prerequisites_setup
      changed_when: false
      failed_when: false

    - name: Derive the node role from exclusive inventory groups
      ansible.builtin.set_fact:
        prerequisites_role_memberships: "{{ ['control_plane', 'worker', 'backup'] | select('in', group_names) | list }}"
        prerequisites_role: "{{ (['control_plane', 'worker', 'backup'] | select('in', group_names) | list | first) | default('unknown', true) }}"

    - name: Initialize validation result collection
      ansible.builtin.set_fact:
        prerequisites_results: []

    - name: Check role assignment
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + [role_result] }}"
      vars:
        role_result:
          section: SYSTEM
          name: Node role assignment
          status: "{{ 'PASS' if prerequisites_role_memberships | length == 1 else 'FAIL' }}"
          actual: "{{ prerequisites_role }}"
          required: Exactly one role
          explanation: "{{ 'Inventory role is valid.' if prerequisites_role_memberships | length == 1 else 'Assign the host to exactly one role group.' }}"
          owner: Infrastructure

    - name: Check validation mode
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + [mode_result] }}"
      vars:
        mode_result:
          section: SYSTEM
          name: Validation mode
          status: "{{ 'PASS' if rke2_validation_mode in rke2_allowed_validation_modes else 'FAIL' }}"
          actual: "{{ rke2_validation_mode }}"
          required: "{{ rke2_allowed_validation_modes | join(' or ') }}"
          explanation: "{{ '' if rke2_validation_mode in rke2_allowed_validation_modes else 'Select fresh_install or existing_install.' }}"
          owner: Infrastructure

  tasks:
    - name: Collect read-only diagnostic data
      ansible.builtin.shell: |
        set +e
        run_diag() {
          diag_key="$1"
          diag_command="$2"
          diag_output=$(eval "$diag_command" 2>/dev/null)
          diag_rc=$?
          diag_encoded=$(printf '%s' "$diag_output" | base64 | tr -d '\n')
          printf '%s\t%s\t%s\n' "$diag_key" "$diag_rc" "$diag_encoded"
        }
        {% for diagnostic in prerequisites_diagnostic_commands %}
        run_diag {{ diagnostic.key | quote }} {{ diagnostic.command | quote }}
        {% endfor %}
      vars:
        prerequisites_diagnostic_commands:
          - { key: hostname_fqdn, command: "hostname --fqdn" }
          - { key: python3, command: "command -v python3" }
          - { key: block_devices, command: "lsblk -rpnbo NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS | awk '{printf \"%s | %s | %.2f GB | %s | %s\\n\", $1, $2, $3/1000000000, $4, ($5 == \"\" ? \"-\" : $5)}'" }
          - { key: root_source, command: "findmnt -n -o SOURCE /" }
          - { key: root_partition_size, command: "findmnt -n -o SOURCE / | xargs -r lsblk -bno SIZE" }
          - { key: root_disk, command: "findmnt -n -o SOURCE / | xargs -r lsblk -s -b -n -o NAME,TYPE,SIZE | awk '$2 == \"disk\" {line=$0} END {print line}'" }
          - { key: root_filesystem_size, command: "df -B1 --output=size / | tail -n 1 | tr -d '[:space:]'" }
          - { key: root_filesystem_available, command: "df -B1 --output=avail / | tail -n 1 | tr -d '[:space:]'" }
          - { key: hostname_resolution, command: "getent ahostsv4 $(hostname --fqdn) | awk '{print $1}' | sort -u" }
          - { key: ipv4, command: "ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1" }
          - { key: default_route, command: "ip route show default" }
          - { key: resolv_conf, command: "awk '/^[[:space:]]*nameserver[[:space:]]/ {print $2}' /etc/resolv.conf" }
          - { key: swap, command: "cat /proc/swaps" }
          - { key: modules, command: "lsmod" }
          - { key: kernel_release, command: "uname -r" }
          - { key: kernel_config, command: "(zgrep -E '^(CONFIG_BPF|CONFIG_BPF_EVENTS|CONFIG_BPF_SYSCALL|CONFIG_NET_CLS_BPF|CONFIG_BPF_JIT|CONFIG_NET_CLS_ACT|CONFIG_NET_SCH_INGRESS|CONFIG_DEBUG_INFO_BTF|CONFIG_CGROUPS|CONFIG_CGROUP_BPF|CONFIG_VXLAN|CONFIG_GENEVE|CONFIG_FIB_RULES|CONFIG_OVERLAY_FS|CONFIG_BRIDGE_NETFILTER|CONFIG_ISCSI_TCP|CONFIG_SCSI_ISCSI)=' /proc/config.gz 2>/dev/null || grep -E '^(CONFIG_BPF|CONFIG_BPF_EVENTS|CONFIG_BPF_SYSCALL|CONFIG_NET_CLS_BPF|CONFIG_BPF_JIT|CONFIG_NET_CLS_ACT|CONFIG_NET_SCH_INGRESS|CONFIG_DEBUG_INFO_BTF|CONFIG_CGROUPS|CONFIG_CGROUP_BPF|CONFIG_VXLAN|CONFIG_GENEVE|CONFIG_FIB_RULES|CONFIG_OVERLAY_FS|CONFIG_BRIDGE_NETFILTER|CONFIG_ISCSI_TCP|CONFIG_SCSI_ISCSI)=' /boot/config-$(uname -r) 2>/dev/null)" }
          - { key: module_files, command: "for module in overlay br_netfilter iscsi_tcp; do find /lib/modules/$(uname -r) -type f -name \"${module}.ko*\" -print -quit 2>/dev/null | sed \"s#^#${module} AVAILABLE=#\"; done" }
          - { key: cgroups, command: "stat -fc %T /sys/fs/cgroup" }
          - { key: bpffs, command: "findmnt -n -t bpf -o TARGET,FSTYPE /sys/fs/bpf" }
          - { key: ip_forward, command: "sysctl -n net.ipv4.ip_forward" }
          - { key: bridge_iptables, command: "sysctl -n net.bridge.bridge-nf-call-iptables" }
          - { key: iptables, command: "command -v iptables" }
          - { key: nft, command: "command -v nft" }
          - { key: iscsiadm, command: "command -v iscsiadm" }
          - { key: iscsid, command: "command -v iscsid" }
          - { key: iscsi_tcp, command: "grep -E '(^| )iscsi_tcp( |$)' /proc/modules" }
          - { key: longhorn_utilities, command: "for tool in fstrim blkid; do command -v \"$tool\" || true; done" }
          - { key: longhorn_path, command: "findmnt -n -o SOURCE,FSTYPE,TARGET,OPTIONS {{ prerequisites_longhorn_data_path | quote }}" }
          - { key: longhorn_capacity, command: "df -B1 -P {{ prerequisites_longhorn_data_path | quote }} | tail -n 1 | awk '{print $2, $4}'" }
          - { key: longhorn_mount_chain, command: "source=$(findmnt -n -o SOURCE {{ prerequisites_longhorn_data_path | quote }} 2>/dev/null || true); if [ -n \"$source\" ] && [ -b \"$source\" ]; then lsblk -s -rpnbo NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS,PKNAME \"$source\"; fi" }
          - { key: longhorn_persistence, command: "path={{ prerequisites_longhorn_data_path | quote }}; unit=$(systemd-escape --path \"$path\" --suffix=mount 2>/dev/null || true); fstab=$(awk -v p=\"$path\" '$2 == p {print $1, $2, $3}' /etc/fstab 2>/dev/null); systemd_state=$(systemctl show \"$unit\" --property=FragmentPath,UnitFileState --value 2>/dev/null | tr '\\n' ' '); printf 'FSTAB=%s SYSTEMD=%s\\n' \"$fstab\" \"$systemd_state\"" }
          - { key: longhorn_disks, command: "root_disk=$(findmnt -n -o SOURCE / 2>/dev/null | xargs -r lsblk -s -nbo NAME,TYPE | awk '$2 == \"disk\" {print $1; exit}'); swap_devices=$(swapon --show=NAME --noheadings 2>/dev/null); lsblk -dnbo PATH,TYPE,SIZE,FSTYPE,MOUNTPOINTS 2>/dev/null | while read -r path type size fstype mountpoint; do [ \"$type\" = disk ] || continue; reason=; child=$(lsblk -nrbo NAME,TYPE,PKNAME \"$path\" 2>/dev/null | awk -v p=\"$path\" '$1 != p {print; exit}'); signature=$(blkid -p -o value -s TYPE \"$path\" 2>/dev/null || true); if [ \"$path\" = \"$root_disk\" ]; then reason=os-disk; elif [ -n \"$child\" ]; then reason=partitions-or-mapped-children; elif [ \"$mountpoint\" != \"-\" ] && [ -n \"$mountpoint\" ]; then reason=mounted; elif printf '%s\\n' \"$swap_devices\" | awk -v p=\"$path\" '$1 == p {found=1} END {exit !found}'; then reason=swap; elif [ -n \"$fstype\" ] || [ -n \"$signature\" ]; then reason=existing-filesystem; fi; if [ -n \"$reason\" ]; then printf 'REJECT\\t%s\\t%s\\t%s\\n' \"$path\" \"$size\" \"$reason\"; else printf 'UNUSED\\t%s\\t%s\\n' \"$path\" \"$size\"; fi; done" }
          - { key: network_manager, command: "systemctl is-enabled NetworkManager; systemctl is-active NetworkManager" }
          - { key: network_manager_cni, command: "grep -R -E 'unmanaged-devices|cni|cilium|flannel|calico' /etc/NetworkManager/conf.d /etc/NetworkManager/NetworkManager.conf 2>/dev/null" }
          - { key: local_ports, command: "ss -lntup 2>/dev/null" }
          - { key: cidr_overlap, command: "python3 -c 'import ipaddress; a=ipaddress.ip_network(\"{{ prerequisites_cilium_pod_cidr | default(\"0.0.0.0/32\") }}\"); b=ipaddress.ip_network(\"{{ prerequisites_cilium_service_cidr | default(\"0.0.0.0/32\") }}\"); print(\"OVERLAP\" if a.overlaps(b) else \"DISJOINT\")'" }
          - { key: systemd_time_ntp, command: "timedatectl show --property=NTP --value" }
          - { key: systemd_time_sync, command: "timedatectl show --property=NTPSynchronized --value" }
          - { key: chrony, command: "command -v chronyc" }
          - { key: chrony_tracking, command: "chronyc tracking" }
          - { key: timesyncd, command: "systemctl is-enabled systemd-timesyncd" }
          - { key: runtime_processes, command: "ps -eo pid=,comm=,args= | awk '$2 ~ /^(rke2|rke2-server|rke2-agent|kubelet|k3s|k3s-agent|microk8s|dockerd|crio|containerd)$/ {print}'" }
          - { key: runtime_process_executables, command: "for pid in $(ps -eo pid=,comm= | awk '$2 ~ /^(rke2|rke2-server|rke2-agent|kubelet|k3s|k3s-agent|microk8s|dockerd|crio|containerd)$/ {print $1}'); do exe=$(readlink -f /proc/$pid/exe 2>/dev/null || true); cmd=$(tr '\\0' ' ' </proc/$pid/cmdline 2>/dev/null || true); printf 'PID=%s EXECUTABLE=%s CMDLINE=%s\\n' \"$pid\" \"$exe\" \"$cmd\"; done" }
          - { key: runtime_services, command: "for service in rke2-server rke2-agent kubelet k3s k3s-agent microk8s docker crio containerd; do state=$(systemctl show \"$service\" --property=ActiveState --value 2>/dev/null || true); printf '%s ActiveState=%s\\n' \"$service\" \"$state\"; done" }
      register: prerequisites_diagnostics
      changed_when: false
      failed_when: false
      no_log: true

    - name: Inspect the explicitly configured dedicated data disk
      ansible.builtin.shell: "lsblk -dnbo NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS {{ prerequisites_data_disk_device | quote }}"
      register: prerequisites_data_disk
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - prerequisites_role in ['worker', 'backup']
        - prerequisites_data_disk_device | default('') | trim | length > 0

    - name: Collect configured endpoint diagnostics
      ansible.builtin.shell: >-
        set -o pipefail;
        if ! getent ahosts {{ item.host | quote }} >/dev/null; then echo DNS_FAILED; exit 0; fi;
        if ! timeout {{ item.timeout | default(5) }} bash -c 'cat < /dev/null > /dev/tcp/{{ item.host }}/{{ item.port }}' 2>/dev/null; then echo TCP_FAILED; exit 0; fi;
        {% if item.tls | default(false) | bool %}if ! timeout {{ item.timeout | default(5) }} openssl s_client -connect {{ item.host }}:{{ item.port }} -servername {{ item.host }} </dev/null >/dev/null 2>&1; then echo TLS_FAILED; exit 0; fi;{% endif %}
        echo OK
      args:
        executable: /bin/bash
      loop: "{{ prerequisites_network_endpoints }}"
      register: prerequisites_endpoint_diagnostics
      changed_when: false
      failed_when: false
      no_log: true
      when: prerequisites_network_endpoints | length > 0

    - name: Convert diagnostic output to an internal lookup
      ansible.builtin.set_fact:
        prerequisites_diag_json: >-
          {% set diag = {} %}
          {% for line in prerequisites_diagnostics.stdout_lines | default([]) %}
          {% set fields = line.split('\t', 2) %}
          {% if fields | length == 3 %}
          {% set decoded = fields[2] | b64decode %}
          {% set _ = diag.update({fields[0]: {'stdout': decoded, 'stdout_lines': decoded.splitlines(), 'rc': fields[1] | int}}) %}
          {% endif %}
          {% endfor %}
          {{ diag | to_json }}
      no_log: true

    - name: Parse diagnostic lookup
      ansible.builtin.set_fact:
        prerequisites_diag: "{{ prerequisites_diag_json | from_json }}"
      no_log: true

    - name: Normalize diagnostic values
      ansible.builtin.set_fact:
        prerequisites_root_disk_raw: "{{ prerequisites_diag.get('root_disk', {}).get('stdout', '') | string | trim }}"
        prerequisites_root_partition_raw: "{{ prerequisites_diag.get('root_partition_size', {}).get('stdout', '') | string | trim }}"
        prerequisites_root_filesystem_raw: "{{ prerequisites_diag.get('root_filesystem_size', {}).get('stdout', '') | string | trim }}"
        prerequisites_root_available_raw: "{{ prerequisites_diag.get('root_filesystem_available', {}).get('stdout', '') | string | trim }}"
        prerequisites_root_disk_valid: "{{ (prerequisites_diag.get('root_disk', {}).get('stdout', '') | string | trim) is match('^[^|]+\\s+disk\\s+[0-9]+') }}"
        prerequisites_root_partition_valid: "{{ (prerequisites_diag.get('root_partition_size', {}).get('stdout', '') | string | trim) is match('^[0-9]+$') }}"
        prerequisites_root_filesystem_valid: "{{ (prerequisites_diag.get('root_filesystem_size', {}).get('stdout', '') | string | trim) is match('^[0-9]+$') }}"
        prerequisites_root_available_valid: "{{ (prerequisites_diag.get('root_filesystem_available', {}).get('stdout', '') | string | trim) is match('^[0-9]+$') }}"

    - name: Initialize configured dedicated disk evidence
      ansible.builtin.set_fact:
        prerequisites_data_raw: "{{ prerequisites_data_disk.stdout | default('') | string | trim }}"

    - name: Parse configured dedicated disk evidence
      ansible.builtin.set_fact:
        prerequisites_data_fields: "{{ prerequisites_data_raw.split() }}"

    - name: Validate configured dedicated disk evidence
      ansible.builtin.set_fact:
        prerequisites_data_valid: "{{ prerequisites_data_fields | length >= 3 and prerequisites_data_fields[1] == 'disk' and prerequisites_data_fields[2] is match('^[0-9]+$') }}"
        prerequisites_data_size_bytes: "{{ prerequisites_data_fields[2] | default('0') | int }}"

    - name: Normalize Longhorn mount and discovery evidence
      ansible.builtin.set_fact:
        prerequisites_longhorn_path_fields: "{{ (prerequisites_diag.get('longhorn_path', {}).get('stdout', '') | string | trim).split() }}"
        prerequisites_longhorn_capacity_fields: "{{ (prerequisites_diag.get('longhorn_capacity', {}).get('stdout', '') | string | trim).split() }}"
        prerequisites_longhorn_chain_lines: "{{ prerequisites_diag.get('longhorn_mount_chain', {}).get('stdout_lines', []) }}"
        prerequisites_longhorn_persistence_raw: "{{ prerequisites_diag.get('longhorn_persistence', {}).get('stdout', '') | string | trim }}"
        prerequisites_longhorn_discovery_lines: "{{ prerequisites_diag.get('longhorn_disks', {}).get('stdout_lines', []) }}"

    - name: Classify discovered Longhorn disks
      ansible.builtin.set_fact:
        prerequisites_longhorn_discovery_json: >-
          {% set suitable = [] %}
          {% set undersized = [] %}
          {% set rejected = [] %}
          {% set complete = prerequisites_diag.get('longhorn_disks', {}).get('rc', 1) | int == 0 and prerequisites_root_disk_valid | bool %}
          {% for line in prerequisites_longhorn_discovery_lines %}
          {% set fields = line.split('\t') %}
          {% if fields | length >= 3 and fields[0] == 'UNUSED' and fields[2] is match('^[0-9]+$') %}
          {% set disk = {'device': fields[1], 'size_bytes': fields[2] | int, 'size_gb': ((fields[2] | int) / 1000000000) | round(2)} %}
          {% if fields[2] | int >= (prerequisites_requirements.get(prerequisites_role, {}).get('data_disk_gb', 0) | int * 1000000000) %}
          {% set _ = suitable.append(disk) %}
          {% else %}
          {% set _ = undersized.append(disk) %}
          {% endif %}
          {% elif fields | length >= 4 and fields[0] == 'REJECT' %}
          {% set _ = rejected.append({'device': fields[1], 'size_bytes': fields[2] | int if fields[2] is match('^[0-9]+$') else 0, 'reason': fields[3]}) %}
          {% endif %}
          {% endfor %}
          {{ {'suitable': suitable, 'undersized': undersized, 'rejected': rejected, 'complete': complete} | to_json }}
    - name: Derive Longhorn storage validation
      ansible.builtin.set_fact:
        prerequisites_longhorn_validation_json: >-
          {% set path = prerequisites_longhorn_data_path %}
          {% set mount = prerequisites_longhorn_path_fields %}
          {% set capacity = prerequisites_longhorn_capacity_fields %}
          {% set chain_disks = prerequisites_longhorn_chain_lines | select('search', '\\sdisk\\s') | list %}
          {% set source = mount[0] | default('') %}
          {% set fstype = mount[1] | default('') %}
          {% set mount_target = mount[2] | default('') %}
          {% set mount_options = mount[3] | default('') %}
          {% set total_valid = capacity | length >= 1 and capacity[0] is match('^[0-9]+$') %}
          {% set available_valid = capacity | length >= 2 and capacity[1] is match('^[0-9]+$') %}
          {% set persistence_evidence = prerequisites_diag.get('longhorn_persistence', {}).get('rc', 1) | int == 0 %}
          {% set persistent = prerequisites_longhorn_persistence_raw is search('FSTAB=[^ ]+ ' ~ (path | regex_escape)) or prerequisites_longhorn_persistence_raw is search('SYSTEMD=.*FragmentPath=.*UnitFileState=(enabled|static|generated)') %}
          {% set source_disk = chain_disks | last | default('') %}
          {% set root_disk = prerequisites_root_disk_raw.split()[0] | default('') %}
          {% set mounted = mount_target == path and source | length > 0 %}
          {% set mount_identity = mounted and source is match('^/dev/') and chain_disks | length > 0 %}
          {% set os_backed = root_disk and source_disk and root_disk in source_disk %}
          {% set mount_confirmed_invalid = mounted and ((mount_options is search('(^|,)bind(,|$)')) or not source is match('^/dev/') or source is search('\\[.*\\]') or os_backed or fstype not in prerequisites_longhorn_filesystems or not total_valid or not available_valid or capacity[0] | int < prerequisites_requirements.get(prerequisites_role, {}).get('data_disk_gb', 0) | int * 1000000000 or not persistent) %}
          {% set mount_incomplete = mounted and source is match('^/dev/') and (not mount_identity or not total_valid or not available_valid or not persistence_evidence) %}
          {% set discovery = prerequisites_longhorn_discovery_json | default('{}') | from_json %}
          {% set override = prerequisites_data_fields %}
          {% set override_configured = prerequisites_data_disk_device | default('') | trim | length > 0 %}
          {% set override_valid = override | length >= 3 and override[1] == 'disk' and override[2] is match('^[0-9]+$') %}
          {% set override_os = override_valid and root_disk and override[0] == root_disk %}
          {% set discovery_status = 'PASS' if discovery.suitable | length == 1 and discovery.complete else ('WARN' if discovery.suitable | length > 1 or not discovery.complete else 'FAIL') %}
          {% set status = 'SKIP' if prerequisites_role != 'worker' else ('FAIL' if mount_confirmed_invalid and not mount_incomplete else ('WARN' if mount_incomplete else 'PASS')) if mounted else ('PASS' if override_configured and override_valid and not override_os and override[2] | int >= prerequisites_requirements.get(prerequisites_role, {}).get('data_disk_gb', 0) | int * 1000000000 else ('FAIL' if override_configured and override_valid else ('WARN' if override_configured else discovery_status))) %}
          {% set incomplete = prerequisites_role == 'worker' and ((mounted and mount_incomplete) or (not mounted and override_configured and (not override_valid)) or (not mounted and not override_configured and (discovery.suitable | length > 1 or not discovery.complete))) %}
          {% set actual = 'Not applicable' if prerequisites_role != 'worker' else ('Mounted ' ~ source ~ ' (' ~ fstype ~ '), ' ~ (capacity[0] | default('unknown')) ~ ' bytes total, ' ~ (capacity[1] | default('unknown')) ~ ' bytes available; persistent=' ~ ('yes' if persistent else 'no') if mounted else ('Override ' ~ prerequisites_data_disk_device ~ ', ' ~ (prerequisites_data_size_bytes | int / 1000000000) | round(2) ~ ' GB, evidence_valid=' ~ ('yes' if override_valid else 'no') if override_configured else ('Suitable: ' ~ (discovery.suitable | map(attribute='device') | join(', ')) ~ '; undersized: ' ~ (discovery.undersized | map(attribute='device') | join(', ')) ~ '; rejected: ' ~ (discovery.rejected | map(attribute='device') | join(', '))))) %}
          {% set explanation = 'Longhorn storage is not applicable to this role.' if prerequisites_role != 'worker' else ('Verify the mounted filesystem source, capacity, available space, and persistent configuration.' if mounted else ('The configured override is invalid or resolves to an unsuitable device.' if override_configured else ('Use prerequisites_data_disk_device to select one suitable disk.' if discovery.suitable | length > 1 else ('No unused disk meets the configured minimum capacity.' if discovery.complete and discovery.suitable | length == 0 else 'Automatic disk discovery evidence is incomplete.')))) %}
          {{ {'status': status, 'incomplete': incomplete, 'actual': actual, 'explanation': explanation, 'evidence_verified': status in ['PASS', 'FAIL']} | to_json }}

    - name: Parse Longhorn storage validation
      ansible.builtin.set_fact:
        prerequisites_longhorn_validation: "{{ prerequisites_longhorn_validation_json | from_json }}"

    - name: Validate system requirements
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + validation_items }}"
      vars:
        req: "{{ prerequisites_requirements[prerequisites_role] | default({}) }}"
        cpu: "{{ ansible_facts.get('processor_vcpus', '') | string | trim }}"
        mem: "{{ ansible_facts.get('memtotal_mb', '') | string | trim }}"
        mem_gib: "{{ ((mem | float) / 1024) | round(2) }}"
        mem_min: "{{ (req.get('memory_gib', 0) | float) * (1 - prerequisites_memory_tolerance | float) }}"
        validation_items:
          - { section: SYSTEM, name: Operating system, status: "{{ 'PASS' if ((ansible_facts.distribution | default('')) == 'Ubuntu' and (ansible_facts.distribution_version | default('')) is version('24.04', '==')) or ((ansible_facts.distribution | default('')) == 'Debian' and (ansible_facts.distribution_version | default('')) is version('13', '==')) else 'WARN' }}", actual: "{{ ansible_facts.distribution | default('Unknown') }} {{ ansible_facts.distribution_version | default('unknown') }}", required: "Ubuntu 24.04 or Debian 13", explanation: "Verify RKE2 compatibility for unsupported OS versions.", owner: Infrastructure }
          - { section: SYSTEM, name: Kernel, status: "{{ 'PASS' if ansible_facts.kernel | default('') else 'WARN' }}", actual: "{{ ansible_facts.kernel | default('unavailable') }}", required: Linux kernel, explanation: "Kernel release evidence is unavailable.", owner: Validation }
          - { section: SYSTEM, name: Architecture, status: "{{ 'PASS' if ansible_facts.architecture | default('') in ['x86_64', 'amd64'] else 'FAIL' }}", actual: "{{ ansible_facts.architecture | default('unavailable') }}", required: x86_64, explanation: "Use an x86_64 VM.", owner: Infrastructure }
          - { section: SYSTEM, name: CPU, status: "{{ 'PASS' if cpu is match('^[0-9]+$') and cpu | int >= req.get('vcpu', 0) | int else ('FAIL' if cpu is match('^[0-9]+$') else 'WARN') }}", actual: "{{ cpu | int }} vCPU", required: "{{ req.get('vcpu', 'unknown') }} vCPU", explanation: "Increase the VM vCPU allocation.", owner: Infrastructure }
          - { section: SYSTEM, name: Memory, status: "{{ 'PASS' if mem is match('^[0-9]+([.][0-9]+)?$') and mem_gib | float >= mem_min | float else ('FAIL' if mem is match('^[0-9]+([.][0-9]+)?$') else 'WARN') }}", actual: "{{ mem_gib }} GiB visible to Linux", required: "{{ req.get('memory_gib', 'unknown') }} GiB provisioned*", explanation: "{{ '' if mem is match('^[0-9]+([.][0-9]+)?$') and mem_gib | float >= mem_min | float else ('Increase visible memory; it is below the tolerated minimum.' if mem is match('^[0-9]+([.][0-9]+)?$') else 'Linux-visible memory evidence is unavailable or malformed.') }}", owner: Infrastructure }
          - { section: SYSTEM, name: Python, status: "{{ 'PASS' if prerequisites_diag.get('python3', {}).get('rc', 1) | int == 0 else 'WARN' }}", actual: "{{ prerequisites_diag.get('python3', {}).get('stdout', 'unavailable') | trim }}", required: python3 available, explanation: "Python is unavailable to Ansible.", owner: Validation }

    - name: Validate storage requirements
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + storage_items }}"
      vars:
        req: "{{ prerequisites_requirements[prerequisites_role] | default({}) }}"
        disk_size: "{{ prerequisites_root_disk_raw.split()[2] | default('') }}"
        disk_name: "{{ prerequisites_root_disk_raw.split()[0] | default('unknown') }}"
        disk_valid: "{{ prerequisites_root_disk_raw is match('^[^ ]+[ ]+disk[ ]+[0-9]+$') }}"
        storage_items:
          - { section: STORAGE, name: OS disk, status: "{{ 'PASS' if disk_valid and disk_size | int >= req.get('os_disk_gb', 0) | int * 1000000000 else ('FAIL' if disk_valid else 'WARN') }}", actual: "{{ ((disk_size | int) / 1000000000) | round(2) }} GB provisioned on {{ disk_name if disk_valid else 'unknown disk' }}", required: "{{ req.get('os_disk_gb', 'unknown') }} GB provisioned", explanation: "{{ '' if disk_valid and disk_size | int >= req.get('os_disk_gb', 0) | int * 1000000000 else ('Increase the provisioned OS disk.' if disk_valid else 'Underlying disk cannot be identified reliably; verify VM storage. An unmounted disk is not inferred safe.') }}", owner: Infrastructure }
          - { section: STORAGE, name: Root partition/device, status: "{{ 'PASS' if prerequisites_root_partition_valid else 'WARN' }}", actual: "{{ (((prerequisites_root_partition_raw | int) / 1000000000) | round(2) ~ ' GB') if prerequisites_root_partition_valid else 'unknown' }}", required: Root device present, explanation: "Root partition or logical-volume size is unavailable.", owner: Validation }
          - { section: STORAGE, name: Root filesystem, status: "{{ 'PASS' if prerequisites_root_filesystem_valid and prerequisites_root_available_valid else 'WARN' }}", actual: "{{ (((prerequisites_root_filesystem_raw | int) / 1000000000) | round(2) ~ ' GB cap / ' ~ ((prerequisites_root_available_raw | int) / 1000000000) | round(2) ~ ' GB free') if prerequisites_root_filesystem_valid and prerequisites_root_available_valid else 'unknown' }}", required: Mounted filesystem available, explanation: "Root filesystem capacity or available space is unavailable.", owner: Validation }
          - { section: STORAGE, name: Dedicated role data disk, status: "{{ prerequisites_longhorn_validation.status if prerequisites_role == 'worker' else ('SKIP' if prerequisites_role == 'control_plane' else ('WARN' if prerequisites_data_disk_device | default('') | trim == '' or not prerequisites_data_valid else ('PASS' if prerequisites_data_size_bytes | int >= req.get('data_disk_gb', 0) | int * 1000000000 else 'FAIL'))) }}", actual: "{{ prerequisites_longhorn_validation.actual if prerequisites_role == 'worker' else ('Not required' if prerequisites_role == 'control_plane' else (prerequisites_data_disk_device if prerequisites_data_disk_device | default('') | trim == '' else (((prerequisites_data_size_bytes | int) / 1000000000) | round(2) ~ ' GB on ' ~ (prerequisites_data_fields[0] | default('unknown')) ~ ' (' ~ (prerequisites_data_fields[3] | default('unformatted')) ~ ')'))) }}", required: "{{ req.get('data_disk_gb', 'unknown') }} GB dedicated device", explanation: "{{ prerequisites_longhorn_validation.explanation if prerequisites_role == 'worker' else ('Configure an explicit dedicated disk; it may remain unformatted and unmounted.' if prerequisites_role == 'backup' and (prerequisites_data_disk_device | default('') | trim == '' or not prerequisites_data_valid) else ('Increase the configured dedicated data disk.' if prerequisites_role == 'backup' and prerequisites_data_valid and prerequisites_data_size_bytes | int < req.get('data_disk_gb', 0) | int * 1000000000 else '')) }}", owner: Infrastructure }

    - name: Validate networking
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + network_items }}"
      vars:
        resolved: "{{ prerequisites_diag.get('hostname_resolution', {}).get('stdout', '') | trim }}"
        addresses: "{{ prerequisites_diag.get('ipv4', {}).get('stdout', '') | trim }}"
        has_global: "{{ resolved.splitlines() | select('in', addresses.split() | list) | list | length > 0 }}"
        loopback_only: "{{ resolved and resolved.splitlines() | reject('match', '^127\\.') | list | length == 0 }}"
        network_items:
          - { section: NETWORK, name: IPv4 address, status: "{{ 'PASS' if addresses else 'FAIL' }}", actual: "{{ addresses.splitlines() | first if addresses else 'none' }}", required: Global IPv4 address, explanation: "{{ '' if addresses else 'Assign a routable IPv4 address.' }}", owner: Infrastructure }
          - { section: NETWORK, name: Default route, status: "{{ 'PASS' if prerequisites_diag.get('default_route', {}).get('stdout', '') | trim else 'FAIL' }}", actual: "{{ 'Configured' if prerequisites_diag.get('default_route', {}).get('stdout', '') | trim else 'Unavailable' }}", required: Default route, explanation: "{{ '' if prerequisites_diag.get('default_route', {}).get('stdout', '') | trim else 'Configure a default route.' }}", owner: Infrastructure }
          - { section: NETWORK, name: Hostname resolution, status: "{{ 'PASS' if has_global else 'WARN' }}", actual: "{{ resolved.splitlines() | first if resolved else 'unavailable' }}", required: Hostname resolves to node IP, explanation: "{{ '' if has_global else ('Hostname resolves only to loopback; map it to the routable node address.' if loopback_only else 'Hostname does not resolve to a routable node address.') }}", evidence_verified: "{{ resolved | length > 0 }}", owner: Infrastructure }
          - { section: NETWORK, name: DNS resolvers, status: "{{ 'PASS' if prerequisites_diag.get('resolv_conf', {}).get('stdout', '') | trim else 'WARN' }}", actual: "{{ prerequisites_diag.get('resolv_conf', {}).get('stdout', 'none') | trim }}", required: Configured resolvers, explanation: "Configure DNS resolvers.", evidence_verified: true, owner: Infrastructure }

    - name: Validate time synchronization
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + [time_result] }}"
      vars:
        synchronized: "{{ prerequisites_diag.get('systemd_time_sync', {}).get('stdout', '') | trim | lower in ['yes', 'true'] or 'leap status: normal' in prerequisites_diag.get('chrony_tracking', {}).get('stdout', '') | lower }}"
        service_present: "{{ prerequisites_diag.get('chrony', {}).get('rc', 1) | int == 0 or prerequisites_diag.get('timesyncd', {}).get('rc', 1) | int == 0 }}"
        time_result:
          section: NETWORK
          name: Time synchronization
          status: "{{ 'PASS' if synchronized else 'WARN' }}"
          actual: "{{ 'Synchronized' if synchronized else ('Service installed/enabled but not synchronized' if service_present else 'Unknown') }}"
          required: Clock synchronized
          explanation: "{{ '' if synchronized else 'Verify actual synchronization; enabled service alone is insufficient.' }}"
          owner: Infrastructure

    - name: Validate RKE2 requirements
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + kube_items }}"
      vars:
        modules: "{{ prerequisites_diag.get('modules', {}).get('stdout', '') }}"
        kernel_config: "{{ prerequisites_diag.get('kernel_config', {}).get('stdout', '') | trim }}"
        module_files: "{{ prerequisites_diag.get('module_files', {}).get('stdout', '') | trim }}"
        swap: "{{ prerequisites_diag.get('swap', {}).get('stdout_lines', []) | length > 1 }}"
        runtime_services: "{{ prerequisites_diag.get('runtime_services', {}).get('stdout', '') | trim }}"
        runtime_processes: "{{ prerequisites_diag.get('runtime_processes', {}).get('stdout', '') | trim }}"
        runtime_executables: "{{ prerequisites_diag.get('runtime_process_executables', {}).get('stdout', '') | trim }}"
        verified_incompatible_runtime: "{{ runtime_services is search('(?m)^(k3s|k3s-agent|microk8s) ActiveState=active$') and runtime_processes is search('(?m)^( *[0-9]+ +)(k3s|k3s-agent|microk8s) ') }}"
        active_runtime_evidence: "{{ runtime_services is search('(?m)^(k3s|k3s-agent|microk8s|kubelet|docker|crio|rke2-server|rke2-agent) ActiveState=active$') or runtime_processes is search('(?m)^( *[0-9]+ +)(k3s|k3s-agent|microk8s|kubelet|dockerd|crio|rke2|rke2-server|rke2-agent) ') }}"
        kube_items:
          - { section: RKE2, name: Swap, status: "{{ 'FAIL' if swap and prerequisites_role in ['control_plane', 'worker'] else ('SKIP' if prerequisites_role == 'backup' else 'PASS') }}", actual: "{{ 'Enabled' if swap else 'Disabled' }}", required: Disabled, explanation: "Disable swap before RKE2 installation.", owner: Infrastructure }
          - { section: RKE2, name: overlay module, status: "{{ 'PASS' if 'overlay' in modules or 'CONFIG_OVERLAY_FS=y' in kernel_config else ('WARN' if 'overlay AVAILABLE=' in module_files else ('SKIP' if rke2_validation_mode == 'fresh_install' else 'WARN')) }}", actual: "{{ 'Loaded' if 'overlay' in modules else ('Built-in' if 'CONFIG_OVERLAY_FS=y' in kernel_config else ('Available but unloaded' if 'overlay AVAILABLE=' in module_files else 'Unavailable or unverifiable')) }}", required: Loaded or built-in, explanation: "Carekube can configure this during installation when available but unloaded.", owner: Carekube }
          - { section: RKE2, name: br_netfilter module, status: "{{ 'PASS' if 'br_netfilter' in modules or 'CONFIG_BRIDGE_NETFILTER=y' in kernel_config else ('WARN' if 'br_netfilter AVAILABLE=' in module_files else ('SKIP' if rke2_validation_mode == 'fresh_install' else 'WARN')) }}", actual: "{{ 'Loaded' if 'br_netfilter' in modules else ('Built-in' if 'CONFIG_BRIDGE_NETFILTER=y' in kernel_config else ('Available but unloaded' if 'br_netfilter AVAILABLE=' in module_files else 'Unavailable or unverifiable')) }}", required: Loaded or built-in, explanation: "Carekube can configure this during installation when available but unloaded.", owner: Carekube }
          - { section: RKE2, name: IPv4 forwarding, status: "{{ 'PASS' if prerequisites_diag.get('ip_forward', {}).get('stdout', '') | trim == '1' else ('WARN' if prerequisites_role in ['control_plane', 'worker'] else 'SKIP') }}", actual: "{{ prerequisites_diag.get('ip_forward', {}).get('stdout', 'unknown') | trim }}", required: Enabled, explanation: "Carekube can configure this during installation.", owner: Carekube }
          - { section: RKE2, name: bridge-nf-call-iptables, status: "{{ 'PASS' if prerequisites_diag.get('bridge_iptables', {}).get('stdout', '') | trim == '1' else ('WARN' if prerequisites_role in ['control_plane', 'worker'] else 'SKIP') }}", actual: "{{ prerequisites_diag.get('bridge_iptables', {}).get('stdout', 'unknown') | trim }}", required: Enabled, explanation: "Carekube can configure this during installation.", owner: Carekube }
          - { section: RKE2, name: iptables or nftables, status: "{{ 'PASS' if prerequisites_diag.get('iptables', {}).get('rc', 1) | int == 0 or prerequisites_diag.get('nft', {}).get('rc', 1) | int == 0 else ('WARN' if prerequisites_role in ['control_plane', 'worker'] else 'SKIP') }}", actual: "{{ 'Available' if prerequisites_diag.get('iptables', {}).get('rc', 1) | int == 0 or prerequisites_diag.get('nft', {}).get('rc', 1) | int == 0 else 'Unavailable' }}", required: Firewall utility available, explanation: "Carekube can install or provide this during installation.", owner: Carekube }
          - { section: RKE2, name: Existing Kubernetes processes, status: "{{ 'FAIL' if verified_incompatible_runtime or (rke2_validation_mode == 'fresh_install' and rke2_clean_install_policy | bool and runtime_services is search('(?m)^(rke2-server|rke2-agent) ActiveState=active$')) else ('WARN' if active_runtime_evidence else ('SKIP' if rke2_validation_mode == 'fresh_install' or prerequisites_role == 'backup' else 'PASS')) }}", actual: "{{ 'Verified incompatible Kubernetes runtime' if verified_incompatible_runtime else ('Runtime evidence requires review' if active_runtime_evidence else 'No incompatible runtime evidence') }}", evidence: "{{ (runtime_services ~ '\\n' ~ runtime_executables ~ '\\n' ~ runtime_processes) | trim }}", required: "No verified incompatible runtime", explanation: "{{ 'Stop or remove the verified incompatible runtime before RKE2 installation.' if verified_incompatible_runtime else ('Review the exact service/process evidence; containerd alone is compatible with RKE2.' if active_runtime_evidence else '') }}", owner: Infrastructure }
          - { section: RKE2, name: NetworkManager compatibility, status: "{{ 'PASS' if not ('active' in prerequisites_diag.get('network_manager', {}).get('stdout', '') | lower) or prerequisites_diag.get('network_manager_cni', {}).get('stdout', '') | trim else 'WARN' }}", actual: "{{ 'CNI interfaces excluded' if prerequisites_diag.get('network_manager_cni', {}).get('stdout', '') | trim else 'No CNI exclusion evidence' }}", required: Ignore CNI-managed interfaces when enabled, explanation: "Carekube can configure NetworkManager during installation.", owner: Carekube }
          - { section: RKE2, name: Local port state, status: "{{ 'SKIP' if not prerequisites_diag.get('runtime_services', {}).get('stdout', '') | trim else 'WARN' }}", actual: "{{ 'RKE2 not installed; runtime listeners not applicable' if not prerequisites_diag.get('runtime_services', {}).get('stdout', '') | trim else 'Inspect local listeners' }}", required: Runtime ports after installation, explanation: "Local listening state is separate from firewall configuration and is checked after RKE2 services exist.", owner: Carekube }

    - name: Validate Cilium requirements
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + cilium_items }}"
      vars:
        kernel_config: "{{ prerequisites_diag.get('kernel_config', {}).get('stdout', '') | trim }}"
        cilium_mode: "{{ prerequisites_cilium_routing_mode | default('') | trim | lower }}"
        cilium_items:
          - { section: CILIUM, name: eBPF kernel capabilities, status: "{{ 'PASS' if kernel_config and ('CONFIG_BPF=y' in kernel_config) and ('CONFIG_CGROUP_BPF=y' in kernel_config) else 'WARN' }}", actual: "{{ 'Required configuration detected' if kernel_config and ('CONFIG_BPF=y' in kernel_config) and ('CONFIG_CGROUP_BPF=y' in kernel_config) else 'Unavailable or incomplete evidence' }}", required: BPF and cgroup BPF support, explanation: "Carekube can provide a compatible kernel or configuration during installation.", owner: Carekube }
          - { section: CILIUM, name: BPF filesystem, status: "{{ 'PASS' if prerequisites_diag.get('bpffs', {}).get('stdout', '') | trim else 'WARN' }}", actual: "{{ prerequisites_diag.get('bpffs', {}).get('stdout', 'Not mounted') | trim }}", required: bpffs support, explanation: "Cilium can mount bpffs during deployment; verify host policy if it cannot.", owner: Carekube }
          - { section: CILIUM, name: Cgroup filesystem, status: "{{ 'PASS' if prerequisites_diag.get('cgroups', {}).get('stdout', '') | trim in ['cgroup2fs', 'tmpfs'] else 'WARN' }}", actual: "{{ prerequisites_diag.get('cgroups', {}).get('stdout', 'unavailable') | trim }}", required: Cgroup support, explanation: "Verify a supported cgroup filesystem before installation.", owner: Carekube }
          - { section: CILIUM, name: Routing mode, status: "{{ 'SKIP' if not cilium_mode else ('PASS' if cilium_mode in ['vxlan', 'native', 'direct', 'wireguard'] else 'WARN') }}", actual: "{{ cilium_mode if cilium_mode else 'Not configured' }}", required: Configured Cilium routing mode, explanation: "Set the intended Cilium routing mode before deployment.", owner: Carekube }
          - { section: CILIUM, name: Pod and service CIDRs, status: "{{ 'PASS' if prerequisites_cilium_pod_cidr | trim and prerequisites_cilium_service_cidr | trim and prerequisites_diag.get('cidr_overlap', {}).get('stdout', '') | trim == 'DISJOINT' else ('FAIL' if prerequisites_diag.get('cidr_overlap', {}).get('stdout', '') | trim == 'OVERLAP' else 'SKIP') }}", actual: "{{ prerequisites_cilium_pod_cidr | default('unset') }} / {{ prerequisites_cilium_service_cidr | default('unset') }}", required: Non-overlapping configured CIDRs, explanation: "Provide both parseable CIDRs to enable a static overlap check.", owner: Carekube }
          - { section: CILIUM, name: Cilium network connectivity, status: "SKIP", actual: "Not probed", required: Mode-specific node connectivity, explanation: "Configure explicit approved probes; local configuration does not prove reachability.", owner: Infrastructure }

    - name: Validate Longhorn requirements
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + longhorn_items }}"
      vars:
        modules: "{{ prerequisites_diag.get('modules', {}).get('stdout', '') }}"
        kernel_config: "{{ prerequisites_diag.get('kernel_config', {}).get('stdout', '') | trim }}"
        module_files: "{{ prerequisites_diag.get('module_files', {}).get('stdout', '') | trim }}"
        longhorn_items:
          - { section: LONGHORN, name: iSCSI initiator tools, status: "{{ 'SKIP' if prerequisites_role != 'worker' else ('PASS' if prerequisites_diag.get('iscsiadm', {}).get('rc', 1) | int == 0 and prerequisites_diag.get('iscsid', {}).get('rc', 1) | int == 0 else 'WARN') }}", actual: "{{ 'Not applicable' if prerequisites_role != 'worker' else ('Available' if prerequisites_diag.get('iscsiadm', {}).get('rc', 1) | int == 0 and prerequisites_diag.get('iscsid', {}).get('rc', 1) | int == 0 else 'Missing; Carekube can install it') }}", required: iscsiadm and iscsid for V1, explanation: "{{ 'Carekube can install and enable open-iscsi during Longhorn preparation.' if prerequisites_role == 'worker' else '' }}", owner: Carekube }
          - { section: LONGHORN, name: iSCSI kernel capability, status: "{{ 'SKIP' if prerequisites_role != 'worker' else ('PASS' if 'iscsi_tcp' in modules or 'CONFIG_ISCSI_TCP=y' in kernel_config else 'WARN') }}", actual: "{{ 'Not applicable' if prerequisites_role != 'worker' else ('Loaded' if 'iscsi_tcp' in modules else ('Built-in' if 'CONFIG_ISCSI_TCP=y' in kernel_config else ('Available but unloaded' if 'iscsi_tcp AVAILABLE=' in module_files else 'Unavailable or unverifiable'))) }}", required: iscsi_tcp loaded or built-in, explanation: "{{ 'Carekube can load or configure iscsi_tcp during installation.' if prerequisites_role == 'worker' and 'iscsi_tcp' not in modules and 'CONFIG_ISCSI_TCP=y' not in kernel_config else '' }}", owner: Carekube }
          - { section: LONGHORN, name: Filesystem utilities, status: "{{ 'SKIP' if prerequisites_role != 'worker' else ('PASS' if prerequisites_diag.get('longhorn_utilities', {}).get('stdout_lines', []) | length >= 2 else 'WARN') }}", actual: "{{ 'Not applicable' if prerequisites_role != 'worker' else (prerequisites_diag.get('longhorn_utilities', {}).get('stdout', 'Missing; Carekube can install them') | trim) }}", required: ext4/XFS and storage utilities, explanation: "{{ 'Carekube can install missing filesystem utilities.' if prerequisites_role == 'worker' else '' }}", owner: Carekube }
          - { section: LONGHORN, name: Data path, status: "{{ prerequisites_longhorn_validation.status }}", actual: "{{ prerequisites_longhorn_validation.actual }}", explanation: "{{ prerequisites_longhorn_validation.explanation }}", incomplete: "{{ prerequisites_longhorn_validation.incomplete }}", evidence_verified: "{{ prerequisites_longhorn_validation.evidence_verified }}", required: Dedicated Longhorn disk identity, capacity, and persistent mount, owner: Infrastructure }

    - name: Validate configured network endpoints
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results + endpoint_items }}"
      vars:
        endpoint_items: >-
          [{% for endpoint in prerequisites_network_endpoints %}
          {{ {'section': 'NETWORK', 'name': endpoint.name | default(endpoint.host), 'status': ('PASS' if prerequisites_endpoint_diagnostics.results[loop.index0].stdout | default('') | trim == 'OK' else 'FAIL'), 'actual': prerequisites_endpoint_diagnostics.results[loop.index0].stdout | default('check unavailable') | trim, 'required': 'Configured endpoint reachable', 'explanation': ('' if prerequisites_endpoint_diagnostics.results[loop.index0].stdout | default('') | trim == 'OK' else 'Verify DNS, TCP, or TLS connectivity.'), 'owner': 'Infrastructure'} | to_json }}{{ ',' if not loop.last else '' }}
          {% endfor %}]
      when: prerequisites_network_endpoints | length > 0

    - name: Classify findings and derive overall readiness
      ansible.builtin.set_fact:
        prerequisites_results_json: >-
          {% set normalized = [] %}
          {% for result in prerequisites_results %}
          {% set mandatory = result.name in prerequisites_mandatory_infrastructure_checks %}
          {% set applicable = result.status != 'SKIP' or result.name == 'Dedicated role data disk' and prerequisites_role in ['worker', 'backup'] %}
          {% set infrastructure = result.owner | default('Validation') == 'Infrastructure' %}
          {% set verified = result.get('evidence_verified', result.status in ['PASS', 'FAIL'] or result.name in ['Operating system', 'Time synchronization']) %}
          {% set incomplete = result.get('incomplete', mandatory and applicable and infrastructure and not verified) %}
          {% set _ = normalized.append(result | combine({'mandatory': mandatory, 'applicable': applicable, 'verified': verified, 'incomplete': incomplete, 'phase': ('Infrastructure' if infrastructure else 'Installation/runtime')})) %}
          {% endfor %}
          {{ normalized | to_json }}
      no_log: true

    - name: Parse classified findings
      ansible.builtin.set_fact:
        prerequisites_results: "{{ prerequisites_results_json | from_json }}"
        prerequisites_readiness: "{{ 'NOT READY' if (prerequisites_results_json | from_json | selectattr('status', 'equalto', 'FAIL') | list | length > 0) else ('INCOMPLETE' if (prerequisites_results_json | from_json | selectattr('incomplete', 'equalto', true) | list | length > 0) else 'READY') }}"
      no_log: true

    - name: Display per-host validation report
      ansible.builtin.debug:
        msg: |
          RKE2 PREREQUISITES — {{ ansible_facts.hostname | default(inventory_hostname) }}
          Inventory: {{ inventory_hostname }}
          Role: {{ prerequisites_role }} | OS: {{ ansible_facts.distribution | default('Unknown') }} {{ ansible_facts.distribution_version | default('unknown') }}

          OVERALL READINESS: {{ prerequisites_readiness }}
          {{ 'Confirmed infrastructure blockers prevent installation.' if prerequisites_readiness == 'NOT READY' else ('Mandatory infrastructure evidence is incomplete; no confirmed blocker was found.' if prerequisites_readiness == 'INCOMPLETE' else 'Infrastructure readiness is verified; Carekube installation tasks may remain.') }}

          SUMMARY BY CATEGORY
          ------------------------------------------------------------------------
          Category          PASS  WARN  FAIL  SKIP
          {% for section in ['SYSTEM', 'STORAGE', 'NETWORK', 'RKE2', 'CILIUM', 'LONGHORN'] %}{{ '%-17s %4d  %4d  %4d  %4d' | format(section, (prerequisites_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'PASS') | list | length), (prerequisites_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'WARN') | list | length), (prerequisites_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'FAIL') | list | length), (prerequisites_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'SKIP') | list | length)) }}
          {% endfor %}

          ACTION REQUIRED — INFRASTRUCTURE BLOCKERS
          ------------------------------------------------------------------------
          {% for result in prerequisites_results if result.status == 'FAIL' %}- {{ result.status }} — {{ result.owner | default('Validation') }} — {{ result.name | default('Check') }}
          Evidence: {{ result.evidence | default(result.actual | default('Unavailable')) }}
          Remediation: {{ result.explanation | default('Review this diagnostic.') }}
          {% endfor %}

          ACTION REQUIRED — CAREKUBE INSTALLATION TASKS
          ------------------------------------------------------------------------
          {% for result in prerequisites_results if result.status == 'WARN' and result.owner | default('') == 'Carekube' %}- {{ result.status }} — {{ result.owner }} — {{ result.name | default('Check') }}
          Evidence: {{ result.evidence | default(result.actual | default('Unavailable')) }}
          Remediation: {{ result.explanation | default('Review this diagnostic.') }}
          {% endfor %}

          INCOMPLETE — UNVERIFIED INFRASTRUCTURE REQUIREMENTS
          ------------------------------------------------------------------------
          {% for result in prerequisites_results if result.incomplete | default(false) | bool %}- INCOMPLETE — {{ result.owner | default('Infrastructure') }} — {{ result.name | default('Check') }}
          Evidence: {{ result.evidence | default(result.actual | default('Unavailable')) }}
          Remediation: {{ result.explanation | default('Verify this requirement.') }}
          {% endfor %}

          DETAILED VALIDATION RESULTS
          {% for section in ['SYSTEM', 'STORAGE', 'NETWORK', 'RKE2', 'CILIUM', 'LONGHORN'] %}
          {{ section }}
          ------------------------------------------------------------------------
          Check                        Status  Actual                             Required
          {% for result in prerequisites_results if result.section == section %}{{ '%-28s %-7s %-34s %s' | format(result.name | truncate(28, true, '...'), result.status, (result.actual | default('') | replace('\n', ' ') | replace('\r', ' ') | truncate(34, true, '...')), (result.required | default('') | replace('\n', ' ') | replace('\r', ' ') | truncate(24, true, '...'))) }}
          {% endfor %}
          {% if section == 'STORAGE' %}
          BLOCK DEVICES
          --------------------------------------------------
          Device       Type    Size       Filesystem  Mount
          --------------------------------------------------
          {{ prerequisites_diag.get('block_devices', {}).get('stdout', 'unavailable') | replace('└─', '') | replace('├─', '') | trim }}
          {% endif %}
          {% endfor %}
          OVERALL READINESS: {{ prerequisites_readiness }}

    - name: Mark mandatory validation failures after report generation
      ansible.builtin.fail:
        msg: "Mandatory RKE2 infrastructure prerequisites failed on {{ inventory_hostname }}. See the report above."
      when: prerequisites_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0
