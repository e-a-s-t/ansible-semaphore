---
- name: Classify RKE2 installation state
  hosts: control_plane:worker
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  pre_tasks:
    - name: Initialize current-run cluster readiness
      ansible.builtin.set_fact:
        rke2_target_hosts: "{{ ansible_play_hosts_all }}"
        rke2_source_ready: false
        rke2_token_ready: false
        rke2_bootstrap_complete: false
        rke2_cluster_token: ''
        rke2_selected_source: "{{ rke2_token_source_node | trim if rke2_token_source_node | trim else rke2_bootstrap_node }}"
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true

    - name: Reset every targeted host readiness for this run
      ansible.builtin.set_fact:
        rke2_preflight_ready: false
      delegate_to: "{{ item }}"
      delegate_facts: true
      run_once: true
      loop: "{{ hostvars['localhost'].rke2_target_hosts }}"

    - name: Validate RKE2 inventory role
      ansible.builtin.assert:
        that:
          - (group_names | intersect(['control_plane', 'worker']) | length) == 1
        fail_msg: "{{ inventory_hostname }} must belong to exactly one of control_plane or worker."

    - name: Validate explicit bootstrap node
      ansible.builtin.assert:
        that:
          - rke2_bootstrap_node | length > 0
          - rke2_bootstrap_node in groups['control_plane']
        fail_msg: "rke2_bootstrap_node must name a control_plane host."
      run_once: true
      delegate_to: localhost
      become: false

    - name: Validate endpoint and version settings
      ansible.builtin.assert:
        that:
          - rke2_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+.*\\+rke2r[0-9]+$')
          - rke2_api_endpoint | length > 0
          - rke2_registration_endpoint | length > 0
          - rke2_api_port | int > 0
          - rke2_registration_port | int > 0
          - rke2_cni == 'cilium'

    - name: Inspect local RKE2 state
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/rke2
        - "{{ rke2_config_path }}"
        - "{{ rke2_data_dir }}"
        - "{{ rke2_managed_marker }}"
      register: rke2_state_paths
      changed_when: false

    - name: Read installed RKE2 version
      ansible.builtin.command: /usr/local/bin/rke2 --version
      check_mode: false
      register: rke2_version_command
      changed_when: false
      failed_when: false
      when: rke2_state_paths.results[0].stat.exists

    - name: Read managed configuration marker
      ansible.builtin.slurp:
        src: "{{ rke2_managed_marker }}"
      register: rke2_marker_content
      changed_when: false
      failed_when: false
      no_log: true
      when: rke2_state_paths.results[3].stat.exists

    - name: Read existing configuration without exposing secrets
      ansible.builtin.slurp:
        src: "{{ rke2_config_path }}"
      register: rke2_existing_config
      changed_when: false
      failed_when: false
      no_log: true
      when: rke2_state_paths.results[1].stat.exists

    - name: Derive managed RKE2 configuration
      ansible.builtin.set_fact:
        rke2_is_control_plane: "{{ 'control_plane' in group_names }}"
        rke2_is_bootstrap: "{{ inventory_hostname == rke2_bootstrap_node }}"
        rke2_effective_sans: "{{ ([rke2_api_endpoint] + (rke2_tls_sans | default([]))) | unique }}"
        rke2_expected_config: >-
          {{ ({
            'cni': rke2_cni,
            'disable': rke2_disabled_components,
            'tls-san': ([rke2_api_endpoint] + (rke2_tls_sans | default([]))) | unique
          }
          | combine(({ 'cluster-init': true } if (inventory_hostname == rke2_bootstrap_node) else
                    { 'server': 'https://' ~ rke2_registration_endpoint ~ ':' ~ (rke2_registration_port | string) }))) }}
      no_log: true

    - name: Classify configuration using sanitized inspection
      ansible.builtin.include_tasks: ../tasks/rke2-classify.yml

    - name: Derive fixed RKE2 Linux AMD64 artifact URLs
      ansible.builtin.set_fact:
        rke2_artifact_release_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}"
        rke2_tarball_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}/rke2.linux-amd64.tar.gz"
        rke2_checksum_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}/sha256sum-amd64.txt"
      when: rke2_state in ['new', 'incomplete_install']

    - name: Probe pinned RKE2 checksum and tarball artifacts
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: HEAD
        follow_redirects: all
        status_code: [200]
        timeout: "{{ rke2_artifact_timeout }}"
        return_content: false
      loop:
        - {name: checksum, url: "{{ rke2_checksum_url }}"}
        - {name: Linux AMD64 tarball, url: "{{ rke2_tarball_url }}"}
      loop_control:
        label: "{{ item.name }}"
      register: rke2_artifact_probes
      changed_when: false
      failed_when: false
      when: rke2_state in ['new', 'incomplete_install']

    - name: Report unavailable pinned RKE2 artifacts
      ansible.builtin.debug:
        msg: >-
          RKE2 preflight failed for {{ item.item.name }}: HTTP status={{ item.status | default('unavailable') }},
          URL={{ item.item.url }}. Verify the pinned release {{ rke2_version }} and network access before retrying.
      loop: "{{ rke2_artifact_probes.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('artifact') }}"
      when:
        - rke2_state in ['new', 'incomplete_install']
        - item.status | default(0) | int != 200

    - name: Require pinned RKE2 artifacts before installation
      ansible.builtin.assert:
        that:
          - rke2_artifact_probes.results | selectattr('status', 'equalto', 200) | list | length == 2
        fail_msg: >-
          Pinned RKE2 release {{ rke2_version }} is not fully accessible. Both the Linux AMD64
          checksum and tarball must be reachable; no installation was attempted.
      when:
        - rke2_state in ['new', 'incomplete_install']

    - name: Refuse unsafe existing state before mutation
      ansible.builtin.assert:
        that:
          - rke2_state in ['new', 'incomplete_install', 'matching']
        fail_msg: >-
          {{ inventory_hostname }} has {{ rke2_state }} RKE2 state. Existing nodes are not
          modified automatically; review configuration and cluster identity before retrying.
      when: not ansible_check_mode

    - name: Record successful node preflight
      ansible.builtin.set_fact:
        rke2_preflight_ready: true
      when: rke2_state in ['new', 'incomplete_install', 'matching']

- name: Validate cluster and existing token source before mutation
  hosts: control_plane:worker
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - ansible.builtin.include_tasks: ../tasks/rke2-barrier.yml
      vars:
        rke2_require_token: false
    - name: Validate selected token source before bootstrap mutation
      ansible.builtin.include_tasks: ../tasks/rke2-token.yml
      when: hostvars[hostvars['localhost'].rke2_selected_source].rke2_state == 'matching'
      run_once: true

- name: Bootstrap or preserve the explicit bootstrap node
  any_errors_fatal: true
  hosts: control_plane
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - name: Enforce cluster-wide readiness before RKE2 mutation
      ansible.builtin.include_tasks: ../tasks/rke2-barrier.yml
      vars:
        rke2_require_token: false
        rke2_require_source: true
    - name: Ensure RKE2 configuration directory exists for a new bootstrap
      ansible.builtin.file:
        path: "{{ rke2_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Install RKE2 server on a new bootstrap
      ansible.builtin.shell: >-
        curl -sfL {{ rke2_install_url | quote }} |
        INSTALL_RKE2_VERSION={{ rke2_version | quote }} INSTALL_RKE2_TYPE=server sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/rke2
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TYPE: server
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      register: rke2_bootstrap_install_result
      changed_when: rke2_bootstrap_install_result.rc == 0
      failed_when: false

    - name: Sanitize failed bootstrap installer diagnostics
      ansible.builtin.set_fact:
        rke2_bootstrap_install_stdout: >-
          {{ rke2_bootstrap_install_result.stdout | default('')
             | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]')
             | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]')
             | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}
        rke2_bootstrap_install_stderr: >-
          {{ rke2_bootstrap_install_result.stderr | default('')
             | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]')
             | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]')
             | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}
      no_log: true
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_bootstrap_install_result.rc != 0

    - name: Report failed bootstrap installer diagnostics
      ansible.builtin.debug:
        msg:
          exit_code: "{{ rke2_bootstrap_install_result.rc }}"
          stdout: "{{ rke2_bootstrap_install_stdout | default('[empty]') }}"
          stderr: "{{ rke2_bootstrap_install_stderr | default('[empty]') }}"
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_bootstrap_install_result.rc != 0

    - name: Stop after failed bootstrap installation
      ansible.builtin.fail:
        msg: "RKE2 bootstrap installer failed with exit code {{ rke2_bootstrap_install_result.rc }}; see sanitized diagnostics above."
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_bootstrap_install_result.rc != 0

    - name: Configure a new embedded-etcd bootstrap server
      ansible.builtin.copy:
        dest: "{{ rke2_config_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          cluster-init: true
          cni: {{ rke2_cni }}
          disable:
          {% for component in rke2_disabled_components %}  - {{ component }}
          {% endfor %}tls-san:
          {% for san in ([rke2_api_endpoint] + (rke2_tls_sans | default([]))) | unique %}  - {{ san }}
          {% endfor %}{% if rke2_join_token | trim | length > 0 %}token: {{ rke2_join_token }}
          {% endif %}
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      no_log: true
      register: rke2_bootstrap_config

    - name: Start and enable a new bootstrap server
      ansible.builtin.service:
        name: rke2-server
        state: started
        enabled: true
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Wait for the bootstrap token
      ansible.builtin.shell: >-
        test -r {{ rke2_data_dir | quote }}/server/node-token ||
        test -r {{ rke2_data_dir | quote }}/server/token
      args:
        executable: /bin/bash
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      register: rke2_token_wait
      retries: 60
      delay: 5
      until: rke2_token_wait.rc == 0
      changed_when: false
      no_log: true

    - name: Record managed bootstrap configuration
      ansible.builtin.copy:
        content: "{{ rke2_expected_config | to_nice_json }}"
        dest: "{{ rke2_managed_marker }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - inventory_hostname == rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      no_log: true

    - name: Record successful bootstrap phase
      ansible.builtin.set_fact:
        rke2_bootstrap_complete: true
      delegate_to: localhost
      delegate_facts: true
      become: false
      when: inventory_hostname == rke2_bootstrap_node

- name: Acquire the cluster token after bootstrap readiness
  hosts: control_plane:worker
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - ansible.builtin.include_tasks: ../tasks/rke2-barrier.yml
      vars:
        rke2_require_token: false
        rke2_require_bootstrap: true
    - ansible.builtin.include_tasks: ../tasks/rke2-token.yml
      run_once: true

- name: Join additional control-plane nodes
  any_errors_fatal: true
  hosts: control_plane
  serial: 1
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - name: Enforce cluster-wide readiness before RKE2 mutation
      ansible.builtin.include_tasks: ../tasks/rke2-barrier.yml
      vars:
        rke2_require_token: true
    - name: Install RKE2 server on a new control-plane node
      ansible.builtin.shell: >-
        curl -sfL {{ rke2_install_url | quote }} |
        INSTALL_RKE2_VERSION={{ rke2_version | quote }} INSTALL_RKE2_TYPE=server sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/rke2
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TYPE: server
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      register: rke2_control_plane_install_result
      changed_when: rke2_control_plane_install_result.rc == 0
      failed_when: false

    - name: Sanitize failed control-plane installer diagnostics
      ansible.builtin.set_fact:
        rke2_control_plane_install_stdout: "{{ rke2_control_plane_install_result.stdout | default('') | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]') | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]') | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}"
        rke2_control_plane_install_stderr: "{{ rke2_control_plane_install_result.stderr | default('') | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]') | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]') | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}"
      no_log: true
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_control_plane_install_result.rc != 0

    - name: Report failed control-plane installer diagnostics
      ansible.builtin.debug:
        msg:
          exit_code: "{{ rke2_control_plane_install_result.rc }}"
          stdout: "{{ rke2_control_plane_install_stdout | default('[empty]') }}"
          stderr: "{{ rke2_control_plane_install_stderr | default('[empty]') }}"
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_control_plane_install_result.rc != 0

    - name: Stop after failed control-plane installation
      ansible.builtin.fail:
        msg: "RKE2 control-plane installer failed with exit code {{ rke2_control_plane_install_result.rc }}; see sanitized diagnostics above."
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_control_plane_install_result.rc != 0

    - name: Configure a new joining control-plane node
      ansible.builtin.copy:
        dest: "{{ rke2_config_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          server: https://{{ rke2_registration_endpoint }}:{{ rke2_registration_port }}
          token: {{ hostvars['localhost']['rke2_cluster_token'] }}
          cni: {{ rke2_cni }}
          disable:
          {% for component in rke2_disabled_components %}  - {{ component }}
          {% endfor %}tls-san:
          {% for san in ([rke2_api_endpoint] + (rke2_tls_sans | default([]))) | unique %}  - {{ san }}
          {% endfor %}
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      no_log: true

    - name: Start a new joining control-plane node
      ansible.builtin.service:
        name: rke2-server
        state: started
        enabled: true
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Record managed joining control-plane configuration
      ansible.builtin.copy:
        content: "{{ rke2_expected_config | to_nice_json }}"
        dest: "{{ rke2_managed_marker }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - inventory_hostname != rke2_bootstrap_node
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      no_log: true

- name: Join worker nodes
  any_errors_fatal: true
  hosts: worker
  serial: 1
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - name: Enforce cluster-wide readiness before RKE2 mutation
      ansible.builtin.include_tasks: ../tasks/rke2-barrier.yml
      vars:
        rke2_require_token: true
    - name: Install RKE2 agent on a new worker
      ansible.builtin.shell: >-
        curl -sfL {{ rke2_install_url | quote }} |
        INSTALL_RKE2_VERSION={{ rke2_version | quote }} INSTALL_RKE2_TYPE=agent sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/rke2
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_TYPE: agent
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
      register: rke2_worker_install_result
      changed_when: rke2_worker_install_result.rc == 0
      failed_when: false

    - name: Sanitize failed worker installer diagnostics
      ansible.builtin.set_fact:
        rke2_worker_install_stdout: "{{ rke2_worker_install_result.stdout | default('') | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]') | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]') | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}"
        rke2_worker_install_stderr: "{{ rke2_worker_install_result.stderr | default('') | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]') | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]') | truncate(rke2_installer_diagnostic_limit | int, true, '...') }}"
      no_log: true
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_worker_install_result.rc != 0

    - name: Report failed worker installer diagnostics
      ansible.builtin.debug:
        msg:
          exit_code: "{{ rke2_worker_install_result.rc }}"
          stdout: "{{ rke2_worker_install_stdout | default('[empty]') }}"
          stderr: "{{ rke2_worker_install_stderr | default('[empty]') }}"
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_worker_install_result.rc != 0

    - name: Stop after failed worker installation
      ansible.builtin.fail:
        msg: "RKE2 worker installer failed with exit code {{ rke2_worker_install_result.rc }}; see sanitized diagnostics above."
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode
        - rke2_worker_install_result.rc != 0

    - name: Ensure worker configuration directory exists
      ansible.builtin.file:
        path: "{{ rke2_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Configure a new worker agent
      ansible.builtin.copy:
        dest: "{{ rke2_config_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          server: https://{{ rke2_registration_endpoint }}:{{ rke2_registration_port }}
          token: {{ hostvars['localhost']['rke2_cluster_token'] }}
      no_log: true
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Start a new worker agent
      ansible.builtin.service:
        name: rke2-agent
        state: started
        enabled: true
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

    - name: Record managed worker configuration
      ansible.builtin.copy:
        content: "{{ rke2_expected_config | to_nice_json }}"
        dest: "{{ rke2_managed_marker }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - rke2_state in ['new', 'incomplete_install']
        - not ansible_check_mode

- name: Verify API and extract kubeconfig
  hosts: localhost
  connection: local
  gather_facts: false
  strategy: linear
  become: false
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - name: Wait for the Kubernetes API endpoint
      ansible.builtin.uri:
        url: "https://{{ rke2_api_endpoint }}:{{ rke2_api_port }}/version"
        method: GET
        validate_certs: false
        status_code: [200, 401, 403]
      register: rke2_api_check
      retries: "{{ rke2_api_wait_retries }}"
      delay: "{{ rke2_api_wait_delay }}"
      until: rke2_api_check.status in [200, 401, 403]
      when: not ansible_check_mode

    - name: Verify registered Kubernetes nodes from a healthy control-plane member
      ansible.builtin.command: >-
        /usr/local/bin/rke2 kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get nodes --no-headers
      delegate_to: "{{ rke2_token_source_node | trim if rke2_token_source_node | trim else rke2_bootstrap_node }}"
      register: rke2_registered_nodes
      changed_when: false
      no_log: true
      failed_when: rke2_registered_nodes.rc != 0
      when: not ansible_check_mode

    - name: Require all inventory nodes to be represented in the API
      ansible.builtin.assert:
        that:
          - (rke2_registered_nodes.stdout_lines | length) >= (groups['control_plane'] | length + groups['worker'] | length)
        fail_msg: "The Kubernetes API did not report all expected control-plane and worker nodes."
      no_log: true
      when: not ansible_check_mode

    - name: Read admin kubeconfig from the selected healthy control-plane member
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      delegate_to: "{{ rke2_token_source_node | trim if rke2_token_source_node | trim else rke2_bootstrap_node }}"
      register: rke2_kubeconfig_source
      no_log: true
      when: not ansible_check_mode

    - name: Create protected kubeconfig directory
      ansible.builtin.file:
        path: "{{ rke2_kubeconfig_path | dirname }}"
        state: directory
        mode: '0700'
      when: not ansible_check_mode

    - name: Extract kubeconfig with external API endpoint
      ansible.builtin.copy:
        content: >-
          {{ (rke2_kubeconfig_source.content | b64decode)
             | regex_replace('https://127\\.0\\.0\\.1:[0-9]+', 'https://' ~ rke2_api_endpoint ~ ':' ~ (rke2_api_port | string))
             | regex_replace('https://localhost:[0-9]+', 'https://' ~ rke2_api_endpoint ~ ':' ~ (rke2_api_port | string)) }}
        dest: "{{ rke2_kubeconfig_path }}"
        mode: '0600'
      no_log: true
      when: not ansible_check_mode

    - name: Report installation completion without secrets
      ansible.builtin.debug:
        msg: |
          RKE2 INSTALLATION — COMPLETE
          Bootstrap node: {{ rke2_bootstrap_node }}
          API endpoint: {{ rke2_api_endpoint }}:{{ rke2_api_port }}
          Registration endpoint: {{ rke2_registration_endpoint }}:{{ rke2_registration_port }}
          CNI: {{ rke2_cni }}
          Kubeconfig: {{ rke2_kubeconfig_path }} (0600)
          Token: preserved and backed up outside the cluster
      when: not ansible_check_mode

    - name: Report check-mode validation without claiming installation
      ansible.builtin.debug:
        msg: >-
          RKE2 CHECK MODE — validation only; no installation, service changes,
          token retrieval, readiness checks, or kubeconfig extraction performed.
      when: ansible_check_mode

- name: Report per-node RKE2 installation state
  hosts: control_plane:worker
  gather_facts: false
  strategy: linear
  become: true
  vars_files:
    - ../vars/rke2.yml
  tasks:
    - name: Gather RKE2 service state
      ansible.builtin.service_facts:

    - name: Report node installation result without secrets
      ansible.builtin.debug:
        msg: >-
          RKE2 NODE REPORT — {{ inventory_hostname }} |
          role={{ 'control_plane' if 'control_plane' in group_names else 'worker' }} |
          state={{ rke2_state }} |
          action={{
            ('WOULD INITIALIZE' if inventory_hostname == rke2_bootstrap_node else 'WOULD JOIN')
            if ansible_check_mode and rke2_state in ['new', 'incomplete_install'] else
            ('WOULD PRESERVE' if ansible_check_mode and rke2_state == 'matching' else
            ('DRIFT DETECTED' if rke2_state == 'drifted' else
            ('UNSAFE STATE' if rke2_state == 'unknown' else
            ('preserved' if rke2_state == 'matching' else 'installed/joined')))) }} |
          service={{ ('rke2-server.service' if 'control_plane' in group_names else 'rke2-agent.service') }}={{
            ansible_facts.services.get('rke2-server.service', ansible_facts.services.get('rke2-agent.service', {})).state | default('unknown') }}
