---
- name: Prepare RKE2 and Longhorn node operating systems
  hosts: proxmox2_targets
  gather_facts: true
  become: true
  vars_files:
    - ../vars/prerequisites.yml
  vars:
    prepare_nodes_common_packages:
      - conntrack
      - curl
      - ebtables
      - e2fsprogs
      - ethtool
      - iproute2
      - iptables
      - socat
      - util-linux
      - xfsprogs
    prepare_nodes_worker_packages:
      - nfs-common
      - open-iscsi
    prepare_nodes_kernel_modules:
      - overlay
      - br_netfilter
    prepare_nodes_network_manager_conf: /etc/NetworkManager/conf.d/99-carekube-rke2-cni.conf
    prepare_nodes_longhorn_mount: "{{ prerequisites_longhorn_data_path }}"

  pre_tasks:
    - name: Derive the inventory role
      ansible.builtin.set_fact:
        prepare_nodes_role_memberships: "{{ ['control_plane', 'worker', 'backup'] | select('in', group_names) | list }}"
        prepare_nodes_role: "{{ (['control_plane', 'worker', 'backup'] | select('in', group_names) | list | first) | default('unknown', true) }}"
        prerequisites_active_profile: "{{ prerequisites_validation_profile | default('production') }}"
        prerequisites_requirements: "{{ prerequisites_production_requirements | combine(prerequisites_requirement_overrides | default({}), recursive=True) }}"

    - name: Refuse invalid inventory role assignment
      ansible.builtin.assert:
        that:
          - prepare_nodes_role_memberships | length == 1
        fail_msg: "{{ inventory_hostname }} must belong to exactly one of control_plane, worker, or backup."

    - name: Refuse unsupported operating systems before mutation
      ansible.builtin.assert:
        that:
          - (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('24.04', '==')) or
            (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_version is version('13', '=='))
        fail_msg: "Unsupported OS on {{ inventory_hostname }}: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}. Supported: Ubuntu 24.04 and Debian 13."

    - name: Initialize preparation change tracking
      ansible.builtin.set_fact:
        prepare_nodes_changes: []

  tasks:
    - name: Install RKE2 operating-system requirements
      ansible.builtin.apt:
        name: "{{ prepare_nodes_common_packages + (prepare_nodes_worker_packages if prepare_nodes_role == 'worker' else []) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: prepare_nodes_packages

    - name: Disable active swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      register: prepare_nodes_swapoff
      changed_when: true

    - name: Disable swap entries persistently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#][^ \t]+[ \t]+[^ \t]+[ \t]+swap[ \t]+.*)$'
        replace: '# disabled by Carekube prepare-nodes: \\1'
        backup: false
      register: prepare_nodes_fstab_swap

    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/carekube-rke2.conf
        owner: root
        group: root
        mode: '0644'
        content: "{{ (prepare_nodes_kernel_modules + (['iscsi_tcp'] if prepare_nodes_role == 'worker' else [])) | join('\n') }}\n"
      register: prepare_nodes_module_file

    - name: Load required kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop: "{{ prepare_nodes_kernel_modules + (['iscsi_tcp'] if prepare_nodes_role == 'worker' else []) }}"
      register: prepare_nodes_modprobe
      changed_when: false

    - name: Configure RKE2 kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-carekube-rke2.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      register: prepare_nodes_sysctl_file

    - name: Apply RKE2 kernel parameters immediately
      ansible.builtin.command: sysctl --system
      when: prepare_nodes_sysctl_file.changed
      register: prepare_nodes_sysctl_apply
      changed_when: true

    - name: Detect NetworkManager
      ansible.builtin.command: systemctl show NetworkManager.service --property=LoadState --value
      register: prepare_nodes_network_manager
      changed_when: false
      failed_when: false

    - name: Exclude CNI-managed interfaces from NetworkManager
      ansible.builtin.copy:
        dest: "{{ prepare_nodes_network_manager_conf }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Carekube prepare-nodes. Keep CNI interfaces out of NetworkManager.
          [keyfile]
          unmanaged-devices=interface-name:cni*;interface-name:cilium*;interface-name:flannel*;interface-name:lxc*;interface-name:vxlan.calico;interface-name:cali*
      when: prepare_nodes_network_manager.stdout | trim == 'loaded'
      register: prepare_nodes_network_manager_conf_result
      notify: Reload NetworkManager

    - name: Install and configure Longhorn worker dependencies
      when: prepare_nodes_role == 'worker'
      block:
        - name: Detect installed iSCSI services
          ansible.builtin.service_facts:

        - name: Select the available iSCSI service
          ansible.builtin.set_fact:
            prepare_nodes_iscsi_service: "{{ 'iscsid' if 'iscsid.service' in ansible_facts.services else ('open-iscsi' if 'open-iscsi.service' in ansible_facts.services else '') }}"

        - name: Enable and start iSCSI service
          ansible.builtin.service:
            name: "{{ prepare_nodes_iscsi_service }}"
            enabled: true
            state: started
          when: prepare_nodes_iscsi_service | length > 0
          register: prepare_nodes_iscsi_service_result

    - name: Inspect the Longhorn mount and underlying disk
      ansible.builtin.shell: |
        set -o pipefail
        path={{ prepare_nodes_longhorn_mount | quote }}
        source=$(findmnt -n -o SOURCE --target "$path" 2>/dev/null || true)
        fstype=$(findmnt -n -o FSTYPE --target "$path" 2>/dev/null || true)
        options=$(findmnt -n -o OPTIONS --target "$path" 2>/dev/null || true)
        disk=''
        size=''
        uuid=''
        if [ -n "$source" ] && [ -b "$source" ]; then
          disk=$(lsblk -s -rpnbo PATH,TYPE "$source" 2>/dev/null | awk '$2 == "disk" {d=$1} END {print d}')
          size=$(lsblk -dnbo SIZE "$disk" 2>/dev/null || true)
          uuid=$(blkid -s UUID -o value "$source" 2>/dev/null || true)
        fi
        fstab_source=$(awk -v p="$path" '$2 == p {print $1; exit}' /etc/fstab 2>/dev/null || true)
        printf 'MOUNT\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$source" "$fstype" "$options" "$disk" "$size" "$uuid" "$fstab_source"
        root_source=$(findmnt -n -o SOURCE / 2>/dev/null || true)
        root_disk=$(findmnt -n -o SOURCE / 2>/dev/null | xargs -r lsblk -s -rpnbo PATH,TYPE 2>/dev/null | awk '$2 == "disk" {print $1; exit}')
        printf 'ROOT\t%s\n' "$root_disk"
      args:
        executable: /bin/bash
      register: prepare_nodes_mount_inspection
      changed_when: false
      when: prepare_nodes_role == 'worker'

    - name: Discover unused worker disks using prerequisite safety rules
      ansible.builtin.shell: |
        set +e
        {{ prerequisites_longhorn_disk_discovery_command }}
      args:
        executable: /bin/bash
      register: prepare_nodes_disk_discovery
      changed_when: false
      when: prepare_nodes_role == 'worker'

    - name: Normalize and select Longhorn storage from shared task sequence
      ansible.builtin.include_tasks: ../tasks/longhorn-storage-state.yml

    - name: Show the selected disk and intended operation before formatting
      ansible.builtin.debug:
        msg: >-
          Longhorn storage selection on {{ inventory_hostname }}:
          device={{ prepare_nodes_selected_device }},
          capacity={{ (prepare_nodes_selected_size | int / 1000000000) | round(2) }} GB,
          operation={{ 'preserve existing filesystem and mount' if prepare_nodes_existing_mount else 'create ext4 filesystem and mount' }}.
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status != 'UNSAFE'

    - name: Report unsafe or ambiguous Longhorn storage before failing
      ansible.builtin.debug:
        msg: >-
          Longhorn storage preparation failed safely on {{ inventory_hostname }}:
          root={{ prepare_nodes_root_disk }};
          unused={{ prepare_nodes_unused_disks }};
          rejected={{ prepare_nodes_rejected_disks }};
          existing_mount={{ prepare_nodes_existing_mount }}.
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'UNSAFE'

    - name: Record Longhorn storage authorization state
      ansible.builtin.set_fact:
        prepare_nodes_storage_authorized: "{{ prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE'] }}"
      when:
        - prepare_nodes_role == 'worker'

    - name: Revalidate the selected Longhorn disk immediately before formatting
      ansible.builtin.shell: |
        set +e
        {{ prerequisites_longhorn_disk_discovery_command }}
      args:
        executable: /bin/bash
      register: prepare_nodes_preformat_discovery
      changed_when: false
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'READY_TO_PREPARE'
        - not ansible_check_mode

    - name: Parse the selected disk pre-format evidence
      ansible.builtin.set_fact:
        prepare_nodes_preformat_root_disk: "{{ (prepare_nodes_preformat_discovery.stdout_lines | select('match', '^ROOT\\t') | list | first | default('ROOT\\t')).split('\\t')[1] | default('') }}"
        prepare_nodes_preformat_matches: "{{ prepare_nodes_preformat_discovery.stdout_lines | select('match', '^UNUSED\\t' ~ (prepare_nodes_selected_device | regex_escape) ~ '\\t') | list }}"
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'READY_TO_PREPARE'
        - not ansible_check_mode

    - name: Abort if the selected disk changed or is no longer conclusively unused
      ansible.builtin.assert:
        that:
          - prepare_nodes_preformat_root_disk == prepare_nodes_root_disk
          - prepare_nodes_preformat_matches | length == 1
          - (prepare_nodes_preformat_matches[0].split('\t')[2] | int) >= (prerequisites_requirements.worker.data_disk_gb | int * 1000000000)
          - prepare_nodes_preformat_matches[0].split('\t')[3] | trim == prepare_nodes_selected_identity | trim
        fail_msg: "Selected Longhorn disk {{ prepare_nodes_selected_device }} changed or is no longer verified unused; no storage was formatted."
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'READY_TO_PREPARE'
        - not ansible_check_mode

    - name: Create the Longhorn filesystem only when explicitly authorized
      ansible.builtin.command: "mkfs.ext4 {{ prepare_nodes_selected_device | quote }}"
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'READY_TO_PREPARE'
        - not ansible_check_mode
      register: prepare_nodes_filesystem
      changed_when: true

    - name: Read the Longhorn filesystem UUID
      ansible.builtin.command: "blkid -s UUID -o value {{ prepare_nodes_selected_device | quote }}"
      register: prepare_nodes_selected_uuid_command
      changed_when: false
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE']
        - prepare_nodes_storage_authorized
        - not ansible_check_mode

    - name: Ensure the Longhorn mount point exists
      ansible.builtin.file:
        path: "{{ prepare_nodes_longhorn_mount }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE']
        - prepare_nodes_storage_authorized
        - not ansible_check_mode

    - name: Mount Longhorn storage by UUID and persist it
      ansible.posix.mount:
        path: "{{ prepare_nodes_longhorn_mount }}"
        src: "UUID={{ prepare_nodes_selected_uuid_command.stdout | trim }}"
        fstype: "{{ prepare_nodes_selected_fstype }}"
        opts: defaults
        dump: '0'
        passno: '2'
        state: mounted
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE']
        - prepare_nodes_storage_authorized
        - not ansible_check_mode
      register: prepare_nodes_mount

    - name: Verify the Longhorn mount identity
      ansible.builtin.shell: |
        set -o pipefail
        source=$(findmnt -n -o SOURCE --target {{ prepare_nodes_longhorn_mount | quote }})
        disk=$(lsblk -s -rpnbo PATH,TYPE "$source" | awk '$2 == "disk" {d=$1} END {print d}')
        fstype=$(findmnt -n -o FSTYPE --target {{ prepare_nodes_longhorn_mount | quote }})
        uuid=$(blkid -s UUID -o value "$source" 2>/dev/null || true)
        printf '%s\t%s\t%s\t%s\n' "$source" "$disk" "$fstype" "$uuid"
      args:
        executable: /bin/bash
      register: prepare_nodes_mount_verification
      changed_when: false
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE']
        - prepare_nodes_storage_authorized
        - not ansible_check_mode

    - name: Confirm the Longhorn mount is backed by the selected disk
      ansible.builtin.assert:
        that:
          - prepare_nodes_mount_verification.stdout.split('\t')[1] == prepare_nodes_selected_device
          - prepare_nodes_mount_verification.stdout.split('\t')[2] == prepare_nodes_selected_fstype
          - prepare_nodes_mount_verification.stdout.split('\t')[3] | length > 0
        fail_msg: "Longhorn mount identity verification failed; expected {{ prepare_nodes_selected_device }}."
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status in ['PREPARED', 'READY_TO_PREPARE']
        - prepare_nodes_storage_authorized
        - not ansible_check_mode

    - name: Build report change list
      ansible.builtin.set_fact:
        prepare_nodes_report_changes: >-
          {{ (['packages'] if prepare_nodes_packages.changed | default(false) else [])
             + (['swap disabled'] if (prepare_nodes_swapoff.changed | default(false)) or (prepare_nodes_fstab_swap.changed | default(false)) else [])
             + (['kernel module persistence'] if prepare_nodes_module_file.changed | default(false) else [])
             + (['sysctl configuration'] if prepare_nodes_sysctl_file.changed | default(false) else [])
             + (['NetworkManager CNI exclusions'] if prepare_nodes_network_manager_conf_result.changed | default(false) else [])
             + (['iSCSI service'] if prepare_nodes_iscsi_service_result is defined and prepare_nodes_iscsi_service_result.changed | default(false) else [])
             + (['Longhorn filesystem'] if prepare_nodes_filesystem.changed | default(false) else [])
             + (['Longhorn mount/fstab'] if prepare_nodes_mount.changed | default(false) else []) }}

    - name: Gather final iSCSI and kernel preparation state
      ansible.builtin.shell: |
        set -o pipefail
        printf 'overlay=%s\n' "$(grep -E '(^| )overlay( |$)' /proc/modules >/dev/null && echo loaded || echo unavailable)"
        printf 'br_netfilter=%s\n' "$(grep -E '(^| )br_netfilter( |$)' /proc/modules >/dev/null && echo loaded || echo unavailable)"
        printf 'iscsi_tcp=%s\n' "$(grep -E '(^| )iscsi_tcp( |$)' /proc/modules >/dev/null && echo loaded || echo not-applicable)"
        printf 'ip_forward=%s\n' "$(sysctl -n net.ipv4.ip_forward)"
        printf 'bridge_iptables=%s\n' "$(sysctl -n net.bridge.bridge-nf-call-iptables)"
        printf 'swap=%s\n' "$(swapon --show=NAME --noheadings | wc -l | tr -d ' ')"
        {% if prepare_nodes_role == 'worker' %}printf 'iscsiadm=%s\n' "$(command -v iscsiadm >/dev/null && echo ready || echo missing)"{% endif %}
      args:
        executable: /bin/bash
      register: prepare_nodes_final_state
      changed_when: false

    - name: Report node preparation
      ansible.builtin.debug:
        msg: |
          RKE2 NODE PREPARATION — {{ ansible_facts.hostname | default(inventory_hostname) }}

          OS preparation:       COMPLETE
          Kernel modules:       COMPLETE
          Sysctl configuration: COMPLETE
          Swap:                 DISABLED
          iSCSI:                {{ 'READY' if prepare_nodes_role != 'worker' or 'iscsiadm=ready' in prepare_nodes_final_state.stdout else 'NOT READY' }}

          {% if prepare_nodes_role == 'worker' %}LONGHORN
          Device:               {{ prepare_nodes_selected_device | default('not selected') }}
          Filesystem:           {{ prepare_nodes_selected_fstype | default('unknown') }}
          Mount:                {{ prepare_nodes_longhorn_mount }}
          Persistent:           {{ 'YES' if prepare_nodes_storage_status == 'PREPARED' or (prepare_nodes_storage_status == 'READY_TO_PREPARE' and prepare_nodes_storage_authorized and not ansible_check_mode) else ('CHECK MODE — NOT CHANGED' if ansible_check_mode and prepare_nodes_storage_status != 'UNSAFE' else 'NO') }}
          Storage preparation:  {{ 'COMPLETE' if prepare_nodes_storage_status == 'PREPARED' or (prepare_nodes_storage_status == 'READY_TO_PREPARE' and prepare_nodes_storage_authorized and not ansible_check_mode) else ('NOT CHANGED' if ansible_check_mode and prepare_nodes_storage_status != 'UNSAFE' else 'UNSAFE') }}{% else %}LONGHORN
          Storage preparation:  NOT APPLICABLE ({{ prepare_nodes_role }}){% endif %}

          Changes made: {{ (prepare_nodes_report_changes | default([]) | join(', ')) or 'none' }}
          Manual actions: None.

    - name: Fail after reporting unsafe or ambiguous storage
      ansible.builtin.fail:
        msg: "Longhorn storage preparation failed safely on {{ inventory_hostname }}; review the report above."
      when:
        - prepare_nodes_role == 'worker'
        - prepare_nodes_storage_status == 'UNSAFE'

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.service:
        name: NetworkManager
        state: reloaded
