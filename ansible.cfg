[defaults]
# Ansible creates private per-process directories beneath this writable base.
# Override with ANSIBLE_LOCAL_TEMP in Semaphore when needed.
local_tmp = /tmp/ansible-semaphore-local
filter_plugins = ./filter_plugins
library = ./library
inventory = inventories/lab/hosts.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = ansible.posix.debug
