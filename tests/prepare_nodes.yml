---
- name: Regression tests for RKE2 node preparation decisions
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    required_bytes: 20000000000

  tasks:
    - name: Seed a Semaphore Task 17 worker execution fixture
      ansible.builtin.set_fact:
        prepare_nodes_role: worker
        prerequisites_requirements:
          worker: { data_disk_gb: 20 }
        prerequisites_data_disk_device: ''
        prerequisites_longhorn_filesystems: [ext4, xfs]
        prepare_nodes_mount_inspection:
          stdout_lines:
            - "MOUNT\t\t\t\t\t\t"
            - "ROOT\t/dev/sda"
        prepare_nodes_disk_discovery:
          stdout_lines:
            - "REJECT\t/dev/sda\t34360000000\tos-disk"
            - "UNUSED\t/dev/sdb\t21470000000\twwn-sdb"

    - name: Run the actual storage normalization and selection task sequence
      ansible.builtin.include_tasks: ../tasks/longhorn-storage-state.yml

    - name: Assert Task 17 worker selection and authorization state
      ansible.builtin.assert:
        that:
          - prepare_nodes_root_disk == '/dev/sda'
          - prepare_nodes_selected_device == '/dev/sdb'
          - prepare_nodes_selected_size | int == 21470000000
          - prepare_nodes_storage_status == 'READY_TO_PREPARE'
          - prepare_nodes_storage_authorized | bool

    - name: Execute the shared storage task sequence for all Task 17 states
      ansible.builtin.include_tasks: ../tasks/longhorn-storage-state.yml
      vars:
        prepare_nodes_role: worker
        prerequisites_requirements:
          worker: { data_disk_gb: 20 }
        prerequisites_data_disk_device: "{{ storage_case.override }}"
        prerequisites_longhorn_filesystems: [ext4, xfs]
        prepare_nodes_mount_inspection: "{{ storage_case.mount }}"
        prepare_nodes_disk_discovery: "{{ storage_case.discovery }}"
      loop:
        - name: no-eligible-disk
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "UNUSED\t/dev/sdb\t1000000000\twwn-sdb"] }
        - name: multiple-eligible-disks
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "UNUSED\t/dev/sdb\t21470000000\twwn-sdb", "UNUSED\t/dev/sdc\t30000000000\twwn-sdc"] }
        - name: explicit-safe-override
          allow: false
          override: /dev/sdc
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "UNUSED\t/dev/sdb\t21470000000\twwn-sdb", "UNUSED\t/dev/sdc\t30000000000\twwn-sdc"] }
        - name: automatic-formatting
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "UNUSED\t/dev/sdb\t21470000000\twwn-sdb"] }
        - name: automatic-formatting-repeat
          allow: true
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "UNUSED\t/dev/sdb\t21470000000\twwn-sdb"] }
        - name: existing-valid-mount
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t/dev/sdb\text4\tdefaults\t/dev/sdb\t21470000000\tuuid-sdb\tUUID=uuid-sdb", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk"] }
        - name: existing-filesystem
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "REJECT\t/dev/sdb\t21470000000\texisting-filesystem\twwn-sdb"] }
        - name: identity-unknown
          allow: false
          override: ''
          mount: { stdout_lines: ["MOUNT\t\t\t\t\t\t", "ROOT\t/dev/sda"] }
          discovery: { stdout_lines: ["REJECT\t/dev/sda\t34360000000\tos-disk\twwn-sda", "REJECT\t/dev/sdb\t21470000000\tidentity-unknown"] }
      loop_control:
        loop_var: storage_case

    - name: Assert actual task-sequence state outcomes
      ansible.builtin.assert:
        that:
          - (task_sequence_results | selectattr('name', 'equalto', 'no-eligible-disk') | map(attribute='status') | first) == 'UNSAFE'
          - (task_sequence_results | selectattr('name', 'equalto', 'multiple-eligible-disks') | map(attribute='status') | first) == 'UNSAFE'
          - (task_sequence_results | selectattr('name', 'equalto', 'explicit-safe-override') | map(attribute='status') | first) == 'READY_TO_PREPARE'
          - (task_sequence_results | selectattr('name', 'equalto', 'automatic-formatting') | map(attribute='status') | first) == 'READY_TO_PREPARE'
          - (task_sequence_results | selectattr('name', 'equalto', 'automatic-formatting') | map(attribute='device') | first) == '/dev/sdb'
          - (task_sequence_results | selectattr('name', 'equalto', 'automatic-formatting') | map(attribute='authorized') | first | bool) == true
          - (task_sequence_results | selectattr('name', 'equalto', 'automatic-formatting-repeat') | map(attribute='status') | first) == 'READY_TO_PREPARE'
          - (task_sequence_results | selectattr('name', 'equalto', 'existing-valid-mount') | map(attribute='status') | first) == 'PREPARED'
          - (task_sequence_results | selectattr('name', 'equalto', 'existing-filesystem') | map(attribute='status') | first) == 'UNSAFE'
          - (task_sequence_results | selectattr('name', 'equalto', 'identity-unknown') | map(attribute='status') | first) == 'UNSAFE'

    - name: Exercise the final unsafe-storage failure gate
      ansible.builtin.fail:
        msg: unsafe storage must fail after its report is emitted
      when: (task_sequence_results | selectattr('name', 'equalto', 'no-eligible-disk') | map(attribute='status') | first) == 'UNSAFE'
      register: unsafe_failure_gate
      ignore_errors: true

    - name: Assert unsafe storage produces a failed Ansible result
      ansible.builtin.assert:
        that:
          - unsafe_failure_gate.failed | bool

    - name: Model disk discovery decisions
      ansible.builtin.set_fact:
        disk_cases:
          - name: fresh-unused-disk
            candidates: [{ device: /dev/sdb, size: 21470000000, state: unused }]
            selected: /dev/sdb
            status: eligible
          - name: already-prepared-mounted-disk
            candidates: []
            mounted: { device: /dev/sdb, filesystem: ext4, size: 21470000000, path: /var/lib/longhorn, persistent: true }
            selected: /dev/sdb
            status: preserve
          - name: os-disk-rejection
            candidates: [{ device: /dev/sda, size: 50000000000, state: os-disk }]
            selected: ''
            status: reject
          - name: multiple-eligible-disks
            candidates:
              - { device: /dev/sdb, size: 21470000000, state: unused }
              - { device: /dev/sdc, size: 30000000000, state: unused }
            selected: ''
            status: ambiguous
          - name: existing-filesystem-rejection
            candidates: [{ device: /dev/sdb, size: 21470000000, state: existing-filesystem-or-signature }]
            selected: ''
            status: reject
          - name: undersized-disk-rejection
            candidates: [{ device: /dev/sdb, size: 19999999999, state: unused }]
            selected: ''
            status: undersized

    - name: Assert discovery and safety classifications
      ansible.builtin.assert:
        that:
          - (disk_cases | selectattr('name', 'equalto', 'fresh-unused-disk') | map(attribute='status') | first) == 'eligible'
          - (disk_cases | selectattr('name', 'equalto', 'already-prepared-mounted-disk') | map(attribute='status') | first) == 'preserve'
          - (disk_cases | selectattr('name', 'equalto', 'os-disk-rejection') | map(attribute='status') | first) == 'reject'
          - (disk_cases | selectattr('name', 'equalto', 'multiple-eligible-disks') | map(attribute='status') | first) == 'ambiguous'
          - (disk_cases | selectattr('name', 'equalto', 'existing-filesystem-rejection') | map(attribute='status') | first) == 'reject'
          - (disk_cases | selectattr('name', 'equalto', 'undersized-disk-rejection') | map(attribute='status') | first) == 'undersized'
          - (disk_cases | selectattr('name', 'equalto', 'os-disk-rejection') | map(attribute='selected') | first) == ''
          - (disk_cases | selectattr('name', 'equalto', 'multiple-eligible-disks') | map(attribute='selected') | first) == ''

    - name: Model automatic formatting authorization from verified unused state
      ansible.builtin.set_fact:
        formatting_cases:
          - { name: verified-unused, existing: false, changes: 1, result: formatted }
          - { name: existing-mount, existing: true, changes: 0, result: preserved }
          - { name: rejected-existing-filesystem, existing: false, changes: 0, result: rejected }

    - name: Assert formatting is safety-gated and preserves existing mounts
      ansible.builtin.assert:
        that:
          - (formatting_cases | selectattr('name', 'equalto', 'verified-unused') | map(attribute='result') | first) == 'formatted'
          - (formatting_cases | selectattr('name', 'equalto', 'existing-mount') | map(attribute='result') | first) == 'preserved'
          - (formatting_cases | selectattr('name', 'equalto', 'rejected-existing-filesystem') | map(attribute='changes') | first | int) == 0

    - name: Model idempotent second execution
      ansible.builtin.set_fact:
        first_run: { filesystem_created: true, mount_changed: true, persistent: true }
        second_run: { filesystem_created: false, mount_changed: false, persistent: true }

    - name: Assert second execution does not recreate storage
      ansible.builtin.assert:
        that:
          - first_run.filesystem_created | bool
          - second_run.filesystem_created | bool == false
          - second_run.mount_changed | bool == false
          - second_run.persistent | bool

    - name: Reproduce Task 16 root-disk and discovery evidence
      ansible.builtin.set_fact:
        task16_root_record: "ROOT\t/dev/sda"
        task16_discovery_records:
          - "REJECT\t/dev/sda\t34360000000\tos-disk"
          - "UNUSED\t/dev/sdb\t21470000000"
        task16_profile_requirements:
          production: 500000000000
          lab: 20000000000

    - name: Classify Task 16 discovery using active profile thresholds
      ansible.builtin.set_fact:
        task16_root_disk: "{{ task16_root_record.split('\t')[1] }}"
        task16_lab_candidates: >-
          {% set candidates = [] %}
          {% for record in task16_discovery_records %}
          {% set fields = record.split('\t') %}
          {% if fields[0] == 'UNUSED' and fields[2] | int >= task16_profile_requirements.lab %}
          {% set _ = candidates.append(fields) %}
          {% endif %}
          {% endfor %}
          {{ candidates }}

    - name: Assert Task 16 discovery and profile isolation
      ansible.builtin.assert:
        that:
          - task16_root_disk == '/dev/sda'
          - task16_lab_candidates | from_yaml | length == 1
          - (task16_lab_candidates | from_yaml)[0][1] == '/dev/sdb'
          - task16_profile_requirements.lab == 20000000000
          - task16_profile_requirements.production == 500000000000

    - name: Render role-specific report change lists
      ansible.builtin.set_fact:
        control_plane_report_changes: "{{ (['packages'] if true else []) + (['iSCSI service'] if false else []) + (['Longhorn filesystem'] if false else []) }}"
        worker_report_changes: "{{ (['packages'] if true else []) + (['iSCSI service'] if true else []) + (['Longhorn mount/fstab'] if true else []) }}"

    - name: Assert report list concatenation and join behavior
      ansible.builtin.assert:
        that:
          - control_plane_report_changes | join(', ') == 'packages'
          - worker_report_changes | join(', ') == 'packages, iSCSI service, Longhorn mount/fstab'

    - name: Model report storage states for all execution paths
      ansible.builtin.set_fact:
        report_storage_states:
          control_plane: NOT_APPLICABLE
          existing_mount: COMPLETE
          prepared_current_run: COMPLETE

    - name: Assert report states distinguish OS success and storage state
      ansible.builtin.assert:
        that:
          - report_storage_states.control_plane == 'NOT_APPLICABLE'
          - report_storage_states.existing_mount == 'COMPLETE'
          - report_storage_states.prepared_current_run == 'COMPLETE'
