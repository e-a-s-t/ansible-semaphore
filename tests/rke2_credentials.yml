---
- name: Exercise production token validation and classification tasks
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: rke2_token_case.yml
      loop:
        - {result: {rc: 0, stdout: ''}, rejected: true}
        - {result: {rc: 0, stdout: '   '}, rejected: true}
        - {result: {rc: 0, stdout: "first\nsecond"}, rejected: true}
        - {result: {rc: 1, stdout: 'fixture-token'}, rejected: true}
        - {result: {}, rejected: true}
        - {result: {rc: 0, stdout: 'K10fixture::server:fixture-secret'}, rejected: false}
      loop_control:
        loop_var: credential
    - name: Prepare an existing managed bootstrap fixture
      ansible.builtin.set_fact:
        rke2_state_paths:
          results:
            - {stat: {exists: true}}
            - {stat: {exists: true}}
            - {stat: {exists: true}}
            - {stat: {exists: true}}
        rke2_version_command: {rc: 0, stdout: 'rke2 version v1.37.1+rke2r1'}
        rke2_version: v1.37.1+rke2r1
        rke2_expected_config: {cluster-init: true, cni: cilium, disable: [ingress], tls-san: [api]}
        rke2_is_bootstrap: true
        rke2_is_control_plane: true
    - ansible.builtin.set_fact:
        rke2_existing_config: "{{ {'content': (rke2_expected_config | to_nice_yaml | b64encode)} }}"
        rke2_marker_content: "{{ {'content': (rke2_expected_config | to_json | b64encode)} }}"
    - ansible.builtin.include_tasks: ../tasks/rke2-classify.yml
    - ansible.builtin.assert:
        that:
          - rke2_state == 'matching'
          - not rke2_config_drift
    - name: Reinspect on idempotent rerun
      ansible.builtin.include_tasks: ../tasks/rke2-classify.yml
    - ansible.builtin.assert:
        that:
          - rke2_state == 'matching'
          - not rke2_config_drift
