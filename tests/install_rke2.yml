---
- name: Regression tests for RKE2 installation decisions
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rke2_version: "v1.37.1+rke2r1"
    rke2_artifact_base_url: https://github.com/rancher/rke2/releases/download
    rke2_bootstrap_node: cp-b
    rke2_api_endpoint: 192.0.2.10
    rke2_api_port: 6443
    rke2_registration_endpoint: 192.0.2.20
    rke2_registration_port: 9345
    generated_token: generated-token-fixture
  tasks:
    - name: Verify explicit bootstrap selection is independent of inventory order
      ansible.builtin.assert:
        that:
          - rke2_bootstrap_node == 'cp-b'
          - rke2_bootstrap_node != 'cp-a'

    - name: Model fresh bootstrap token generation and reuse
      ansible.builtin.set_fact:
        bootstrap_token: "{{ generated_token }}"
        joining_server: "https://{{ rke2_registration_endpoint }}:{{ rke2_registration_port }}"
        api_server: "https://{{ rke2_api_endpoint }}:{{ rke2_api_port }}"

    - name: Assert generated token is reused and endpoints remain separate
      ansible.builtin.assert:
        that:
          - bootstrap_token == generated_token
          - joining_server == 'https://192.0.2.20:9345'
          - api_server == 'https://192.0.2.10:6443'
          - joining_server != api_server

    - name: Model bootstrap-only cluster initialization
      ansible.builtin.set_fact:
        bootstrap_config: {cluster-init: true, cni: cilium}
        joining_config: {server: 'https://192.0.2.20:9345', cni: cilium}

    - name: Assert joining servers never receive cluster-init
      ansible.builtin.assert:
        that:
          - bootstrap_config['cluster-init'] | bool
          - "'cluster-init' not in joining_config"

    - name: Model configuration classifications
      ansible.builtin.set_fact:
        matching: {state: matching, identity: intended}
        drifted: {state: drifted, identity: intended}
        foreign: {state: foreign_cluster, identity: different}
        unknown: {state: unknown, identity: unavailable}

    - name: Assert configuration drift is distinct from cluster identity
      ansible.builtin.assert:
        that:
          - matching.state == 'matching'
          - drifted.state == 'drifted'
          - foreign.state == 'foreign_cluster'
          - unknown.state == 'unknown'
          - drifted.identity == 'intended'
          - foreign.identity == 'different'

    - name: Model expansion without existing-member mutation
      ansible.builtin.set_fact:
        existing_members_before: [cp-a, cp-b, worker-a]
        existing_members_after: [cp-a, cp-b, worker-a, cp-c, worker-b]
        mutated_existing_members: []

    - name: Assert expansion preserves existing members
      ansible.builtin.assert:
        that:
          - existing_members_before | difference(existing_members_after) | length == 0
          - mutated_existing_members | length == 0

    - name: Model token backup and kubeconfig secrecy
      ansible.builtin.set_fact:
        token_backup_mode: '0600'
        kubeconfig_mode: '0600'
        report: 'Token preserved and backed up outside the cluster'

    - name: Assert credentials are not included in reports
      ansible.builtin.assert:
        that:
          - token_backup_mode == '0600'
          - kubeconfig_mode == '0600'
          - generated_token not in report
          - "'token:' not in report"

    - name: Define check-mode state-report fixtures
      ansible.builtin.set_fact:
        check_mode_cases:
          - {name: fresh-bootstrap, host: cp-b, state: new, expected: 'WOULD INITIALIZE'}
          - {name: fresh-control-plane, host: cp-c, state: new, expected: 'WOULD JOIN'}
          - {name: fresh-worker, host: worker-a, state: new, expected: 'WOULD JOIN'}
          - {name: existing-installation, host: cp-b, state: matching, expected: 'WOULD PRESERVE'}
          - {name: configuration-drift, host: cp-b, state: drifted, expected: 'DRIFT DETECTED'}
          - {name: unsafe-state, host: cp-b, state: unknown, expected: 'UNSAFE STATE'}

    - name: Assert check-mode report action for each node state
      ansible.builtin.assert:
        that:
          - calculated_action == check_case.expected
          - calculated_action not in ['COMPLETE', 'installed', 'joined']
      vars:
        calculated_action: >-
          {{ ('WOULD INITIALIZE' if check_case.host == rke2_bootstrap_node else 'WOULD JOIN')
             if check_case.state == 'new' else
             ('WOULD PRESERVE' if check_case.state == 'matching' else
             ('DRIFT DETECTED' if check_case.state == 'drifted' else 'UNSAFE STATE')) }}
      loop: "{{ check_mode_cases }}"
      loop_control:
        loop_var: check_case

    - name: Assert check mode excludes installation-dependent operations
      ansible.builtin.assert:
        that:
          - check_mode_operations | intersect(forbidden_check_mode_operations) | length == 0
      vars:
        check_mode_operations:
          - classify
          - validate-version
          - validate-configuration
          - validate-service-state
          - report
        forbidden_check_mode_operations:
          - install-rke2
          - write-config
          - manage-service
          - retrieve-token
          - api-readiness
          - node-registration
          - extract-kubeconfig

    - name: Derive fixed release artifact URLs
      ansible.builtin.set_fact:
        test_release_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}"
        test_tarball_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}/rke2.linux-amd64.tar.gz"
        test_checksum_url: "{{ rke2_artifact_base_url }}/{{ rke2_version | replace('+', '%2B') }}/sha256sum-amd64.txt"

    - name: Assert the release is pinned to fixed Linux AMD64 artifacts
      ansible.builtin.assert:
        that:
          - rke2_version == 'v1.37.1+rke2r1'
          - "'%2B' in test_release_url"
          - test_tarball_url is search('/rke2\\.linux-amd64\\.tar\\.gz$')
          - test_checksum_url is search('/sha256sum-amd64\\.txt$')
          - test_release_url is not search('/channels')

    - name: Model sanitized installer diagnostics
      ansible.builtin.set_fact:
        installer_exit_code: 23
        installer_raw_stderr: 'download failed token=super-secret password:other-secret'
        installer_sanitized_stderr: "{{ 'download failed token=super-secret password:other-secret' | regex_replace('(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^\\s]+', '\\1\\2[REDACTED]') | regex_replace('(?i)bearer\\s+[^\\s]+', 'Bearer [REDACTED]') }}"

    - name: Assert installer diagnostics preserve failure context but redact secrets
      ansible.builtin.assert:
        that:
          - installer_exit_code == 23
          - "'[REDACTED]' in installer_sanitized_stderr"
          - "'super-secret' not in installer_sanitized_stderr"
          - "'other-secret' not in installer_sanitized_stderr"

    - name: Model safe retry states after incomplete installation
      ansible.builtin.set_fact:
        binary_only_state: incomplete_install
        cluster_data_state: unknown
        retry_mutations: [install, configure, start]
        forbidden_recovery_actions: [delete-data, uninstall, rotate-token]

    - name: Assert incomplete installation is retryable without destructive recovery
      ansible.builtin.assert:
        that:
          - binary_only_state == 'incomplete_install'
          - cluster_data_state == 'unknown'
          - retry_mutations | length == 3
          - forbidden_recovery_actions | intersect(['delete-data', 'uninstall', 'rotate-token']) | length == 3

    - name: Model existing bootstrap token retrieval connection context
      ansible.builtin.set_fact:
        token_source_host: cp-b
        token_source_play_hosts: control_plane
        token_source_become: true
        controller_transfer_delegate: localhost
        controller_transfer_become: false
        controller_transfer_delegate_facts: true
        controller_token_backup_mode: '0600'

    - name: Assert token retrieval uses target SSH context and protected controller transfer
      ansible.builtin.assert:
        that:
          - token_source_host == rke2_bootstrap_node
          - token_source_play_hosts == 'control_plane'
          - token_source_become | bool
          - controller_transfer_delegate == 'localhost'
          - not controller_transfer_become | bool
          - controller_transfer_delegate_facts | bool
          - controller_token_backup_mode == '0600'

    - name: Model interrupted bootstrap recovery after configuration was written
      ansible.builtin.set_fact:
        interrupted_bootstrap:
          binary: true
          config: true
          data_dir: true
          marker: false
          token: true
        interrupted_bootstrap_state: matching
        recovery_actions: [read-token, backup-token, preserve-config]

    - name: Assert interrupted bootstrap resumes without reinstall or token rotation
      ansible.builtin.assert:
        that:
          - interrupted_bootstrap.binary | bool
          - interrupted_bootstrap.config | bool
          - interrupted_bootstrap.token | bool
          - not interrupted_bootstrap.marker | bool
          - interrupted_bootstrap_state == 'matching'
          - "'read-token' in recovery_actions"
          - "'backup-token' in recovery_actions"
          - "'preserve-config' in recovery_actions"
          - "'delete-data' not in recovery_actions"
          - "'rotate-token' not in recovery_actions"

    - name: Model check-mode token suppression
      ansible.builtin.set_fact:
        check_mode_token_operations: [classify, inspect-config, inspect-service, report]

    - name: Assert check mode does not retrieve or transfer tokens
      ansible.builtin.assert:
        that:
          - check_mode_token_operations | intersect(['read-token', 'backup-token', 'join-with-token']) | length == 0
