---
- name: Regression tests for prerequisites numeric validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    test_requirements:
      vcpu: "4"
      memory_gib: "8"
      os_disk_gb: "100"
      data_disk_gb: "500"
    test_tolerance: "0.05"

  tasks:
    - name: Normalize valid numeric strings
      ansible.builtin.set_fact:
        test_cpu: "{{ '4' | int }}"
        test_memory: "{{ '7.76' | float }}"
        test_root_disk: "{{ '100000000000' | int }}"
        test_data_disk: "{{ '500000000000' | int }}"
        test_rc: "{{ '0' | int }}"

    - name: Assert valid strings are converted before comparison
      ansible.builtin.assert:
        that:
          - (test_cpu | int) >= (test_requirements.vcpu | int)
          - (test_memory | float) >= ((test_requirements.memory_gib | float) * (1 - (test_tolerance | float)))
          - (test_root_disk | int) >= ((test_requirements.os_disk_gb | int) * 1000000000)
          - (test_data_disk | int) >= ((test_requirements.data_disk_gb | int) * 1000000000)
          - (test_rc | int) == 0

    - name: Model unavailable and malformed diagnostics
      ansible.builtin.set_fact:
        missing_raw: ""
        malformed_raw: "not-a-number"
        missing_valid: false
        malformed_valid: false
        missing_numeric: "{{ '' | int }}"
        malformed_numeric: "{{ 'not-a-number' | int }}"
        missing_cpu_raw: ""
        missing_memory_raw: ""

    - name: Derive unavailable diagnostic statuses
      ansible.builtin.set_fact:
        missing_cpu_valid: "{{ missing_cpu_raw is match('^[0-9]+$') }}"
        missing_memory_valid: "{{ missing_memory_raw is match('^[0-9]+([.][0-9]+)?$') }}"
        missing_status: "{{ 'WARN' if not (missing_valid | bool) else 'FAIL' }}"
        malformed_status: "{{ 'WARN' if not (malformed_valid | bool) else 'FAIL' }}"

    - name: Derive unavailable CPU and memory statuses
      ansible.builtin.set_fact:
        missing_cpu_status: "{{ 'WARN' if not (missing_cpu_valid | bool) else 'FAIL' }}"
        missing_memory_status: "{{ 'WARN' if not (missing_memory_valid | bool) else 'FAIL' }}"

    - name: Assert unavailable and malformed values produce WARN inputs
      ansible.builtin.assert:
        that:
          - not (missing_valid | bool)
          - not (malformed_valid | bool)
          - (missing_numeric | int) == 0
          - (malformed_numeric | int) == 0
          - missing_status == "WARN"
          - malformed_status == "WARN"
          - missing_cpu_status == "WARN"
          - missing_memory_status == "WARN"

    - name: Assert confidently undersized disks remain FAIL
      ansible.builtin.assert:
        that:
          - ("FAIL" if ("90000000000" | int) < ((test_requirements.os_disk_gb | int) * 1000000000) else "PASS") == "FAIL"
          - ("FAIL" if ("400000000000" | int) < ((test_requirements.data_disk_gb | int) * 1000000000) else "PASS") == "FAIL"

    - name: Model conservative storage, DNS, and time diagnostics
      ansible.builtin.set_fact:
        ambiguous_disk_status: "{{ 'PASS' if '/dev/mapper/root lvm 50000000000' is match('^[^ ]+[ ]+disk[ ]+[0-9]+$') else 'WARN' }}"
        loopback_hostname_status: "{{ 'PASS' if ['127.0.1.1'] | select('in', ['192.168.50.165']) | list | length > 0 else 'WARN' }}"
        unsynchronized_time_status: "{{ 'PASS' if ('yes' in 'no' and 'leap status: normal' in '') else 'WARN' }}"

    - name: Assert ambiguous infrastructure evidence is not promoted to PASS
      ansible.builtin.assert:
        that:
          - ambiguous_disk_status == "WARN"
          - loopback_hostname_status == "WARN"
          - unsynchronized_time_status == "WARN"

    - name: Render a compact report fixture
      ansible.builtin.set_fact:
        report_fixture: |
          RKE2 PREREQUISITES — basel-rke2-01
          Inventory: basel-rke2-01
          Role: control_plane

          SYSTEM
          Check                        Status  Actual                             Required
          Memory                       PASS    7.75 GiB visible to Linux          8 GiB provisioned*

          STORAGE
          OS disk                      WARN    unknown disk                       100 GB provisioned

          NETWORK
          Hostname resolution          WARN    127.0.1.1                         Node IP

          SUMMARY
          PASS: 1 | WARN: 2 | FAIL: 0 | SKIP: 0

    - name: Assert report formatting is human-readable and does not expose raw diagnostics
      ansible.builtin.assert:
        that:
          - "'SYSTEM' in report_fixture"
          - "'STORAGE' in report_fixture"
          - "'NETWORK' in report_fixture"
          - "'SUMMARY' in report_fixture"
          - "'[WARN]' not in report_fixture or 'OS disk' in report_fixture"
          - "'stdout' not in report_fixture"
          - "'invocation' not in report_fixture"
          - "'{' not in report_fixture"

    - name: Build representative validation results for summary rendering
      ansible.builtin.set_fact:
        summary_results:
          - { section: SYSTEM, status: PASS, name: CPU, owner: Infrastructure, explanation: "" }
          - { section: SYSTEM, status: WARN, name: Operating system, owner: Infrastructure, explanation: "Verify supported OS before installation." }
          - { section: STORAGE, status: FAIL, name: OS disk, owner: Infrastructure, explanation: "Increase the provisioned OS disk." }
          - { section: STORAGE, status: SKIP, name: Dedicated role data disk, owner: Infrastructure, explanation: "" }
          - { section: NETWORK, status: PASS, name: IPv4 address, owner: Infrastructure, explanation: "" }
          - { section: NETWORK, status: WARN, name: DNS resolvers, owner: Infrastructure, explanation: "Configure DNS resolvers." }
          - { section: KUBERNETES, status: PASS, name: Swap, owner: Infrastructure, explanation: "" }
          - { section: KUBERNETES, status: WARN, name: overlay module, owner: Carekube, explanation: "Can be configured during RKE2 installation." }
          - { section: KUBERNETES, status: SKIP, name: Existing Kubernetes processes, owner: Infrastructure, explanation: "" }

    - name: Render category and action summary fixture
      ansible.builtin.set_fact:
        summary_fixture: |
          SUMMARY BY CATEGORY
          Category          PASS  WARN  FAIL  SKIP
          {% for section in ['SYSTEM', 'STORAGE', 'NETWORK', 'KUBERNETES'] %}{{ '%-17s %4d  %4d  %4d  %4d' | format(section, (summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'PASS') | list | length), (summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'WARN') | list | length), (summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'FAIL') | list | length), (summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'SKIP') | list | length)) }}
          {% endfor %}
          ACTION REQUIRED
          Infrastructure: resolve before installation | Carekube: resolve during installation
          Status  Owner          Issue
          {% for result in summary_results if result.status in ['WARN', 'FAIL'] %}{{ '%-7s %-14s %s' | format(result.status, result.owner, ((result.name ~ ': ' ~ result.explanation) | truncate(56, true, '...'))) }}
          {% endfor %}
          OVERALL RESULT: {{ 'NOT READY' if summary_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 else ('READY WITH WARNINGS' if summary_results | selectattr('status', 'equalto', 'WARN') | list | length > 0 else 'READY') }}

    - name: Assert category counts, ownership, and overall status
      ansible.builtin.assert:
        that:
          - "summary_fixture is search('SYSTEM\\s+1\\s+1\\s+0\\s+0')"
          - "summary_fixture is search('STORAGE\\s+0\\s+0\\s+1\\s+1')"
          - "summary_fixture is search('NETWORK\\s+1\\s+1\\s+0\\s+0')"
          - "summary_fixture is search('KUBERNETES\\s+1\\s+1\\s+0\\s+1')"
          - "summary_fixture is search('FAIL\\s+Infrastructure\\s+OS disk: Increase the provisioned OS disk.')"
          - "summary_fixture is search('WARN\\s+Carekube\\s+overlay module: Can be configured during RKE2 installation.')"
          - "'OVERALL RESULT: NOT READY' in summary_fixture"
          - "'Infrastructure: resolve before installation' in summary_fixture"
          - "'Carekube: resolve during installation' in summary_fixture"

    - name: Render clean summary fixture
      ansible.builtin.set_fact:
        clean_summary_results:
          - { section: SYSTEM, status: PASS }
          - { section: STORAGE, status: PASS }
          - { section: NETWORK, status: PASS }
          - { section: KUBERNETES, status: PASS }

    - name: Render clean summary text
      ansible.builtin.set_fact:
        clean_summary: |
          SUMMARY BY CATEGORY
          Category          PASS  WARN  FAIL  SKIP
          {% for section in ['SYSTEM', 'STORAGE', 'NETWORK', 'KUBERNETES'] %}{{ '%-17s %4d  %4d  %4d  %4d' | format(section, (clean_summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'PASS') | list | length), (clean_summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'WARN') | list | length), (clean_summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'FAIL') | list | length), (clean_summary_results | selectattr('section', 'equalto', section) | selectattr('status', 'equalto', 'SKIP') | list | length)) }}
          {% endfor %}
          ACTION REQUIRED
          Status  Owner          Issue
          {% for result in clean_summary_results if result.status in ['WARN', 'FAIL'] %}{{ result.status }} {{ result.name }}
          {% endfor %}
          OVERALL RESULT: {{ 'NOT READY' if clean_summary_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 else ('READY WITH WARNINGS' if clean_summary_results | selectattr('status', 'equalto', 'WARN') | list | length > 0 else 'READY') }}

    - name: Assert clean summary rendering has no actions or warnings
      ansible.builtin.assert:
        that:
          - "clean_summary is search('SYSTEM\\s+1\\s+0\\s+0\\s+0')"
          - "clean_summary is search('STORAGE\\s+1\\s+0\\s+0\\s+0')"
          - "clean_summary is search('NETWORK\\s+1\\s+0\\s+0\\s+0')"
          - "clean_summary is search('KUBERNETES\\s+1\\s+0\\s+0\\s+0')"
          - clean_summary.splitlines() | select('match', '^WARN\\s') | list | length == 0
          - clean_summary.splitlines() | select('match', '^FAIL\\s') | list | length == 0
          - "'OVERALL RESULT: READY' in clean_summary"
          - clean_summary_results | selectattr('status', 'equalto', 'WARN') | list | length == 0
          - clean_summary_results | selectattr('status', 'equalto', 'FAIL') | list | length == 0

    - name: Model callback-safe report and bounded table values
      ansible.builtin.set_fact:
        report_lines:
          - "SYSTEM"
          - "Memory                       PASS    7.75 GiB visible to Linux          8 GiB provisioned"
          - ""
          - "BLOCK DEVICES"
          - "/dev/sda     disk    53.69 GB   -           -"
        long_actual: "default via 192.168.50.165 dev ens18 proto dhcp src 192.168.50.165 metric 100"
        raw_block_devices: "└─/dev/sda1 part 52.61 GB ext4 /"

    - name: Derive callback-safe report values
      ansible.builtin.set_fact:
        report_text: "{{ report_lines | join('\n') }}"
        bounded_actual: "{{ long_actual | truncate(34, true, '...') }}"
        normalized_block_devices: "{{ raw_block_devices | replace('└─', '') | replace('├─', '') }}"

    - name: Simulate report-before-failure control flow
      block:
        - name: Mark report as emitted
          ansible.builtin.set_fact:
            report_generated: true
        - name: Simulate mandatory failure
          ansible.builtin.fail:
            msg: simulated mandatory prerequisite failure
      rescue:
        - name: Mark failure as observed after report
          ansible.builtin.set_fact:
            mandatory_failure: true

    - name: Assert callback-safe report behavior and failure ordering
      ansible.builtin.assert:
        that:
          - "'\\\\n' not in report_text"
          - "'SYSTEM\n' in report_text"
          - "'BLOCK DEVICES\n' in report_text"
          - "'└─' not in normalized_block_devices"
          - "normalized_block_devices.startswith('/dev/sda1')"
          - "bounded_actual | length <= 34"
          - "bounded_actual.endswith('...')"
          - report_generated
          - mandatory_failure

    - name: Model three-state readiness classification
      ansible.builtin.set_fact:
        fresh_vm_results:
          - { status: PASS, mandatory: true, applicable: true, owner: Infrastructure, incomplete: false }
          - { status: WARN, mandatory: false, applicable: true, owner: Carekube, incomplete: false }
        uncertain_vm_results:
          - { status: WARN, mandatory: true, applicable: true, owner: Infrastructure, incomplete: true }
        blocked_vm_results:
          - { status: FAIL, mandatory: true, applicable: true, owner: Infrastructure, incomplete: false }

    - name: Derive three-state readiness values
      ansible.builtin.set_fact:
        fresh_vm_readiness: "{{ 'NOT READY' if fresh_vm_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 else ('INCOMPLETE' if fresh_vm_results | selectattr('incomplete', 'equalto', true) | list | length > 0 else 'READY') }}"
        uncertain_vm_readiness: "{{ 'NOT READY' if uncertain_vm_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 else ('INCOMPLETE' if uncertain_vm_results | selectattr('incomplete', 'equalto', true) | list | length > 0 else 'READY') }}"
        blocked_vm_readiness: "{{ 'NOT READY' if blocked_vm_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 else ('INCOMPLETE' if blocked_vm_results | selectattr('incomplete', 'equalto', true) | list | length > 0 else 'READY') }}"

    - name: Assert fresh VM, incomplete evidence, and confirmed blocker states
      ansible.builtin.assert:
        that:
          - fresh_vm_readiness == 'READY'
          - uncertain_vm_readiness == 'INCOMPLETE'
          - blocked_vm_readiness == 'NOT READY'
          - fresh_vm_results | selectattr('owner', 'equalto', 'Carekube') | selectattr('incomplete', 'equalto', true) | list | length == 0

    - name: Assert prioritized report ordering
      ansible.builtin.assert:
        that:
          - report_text.find('OVERALL READINESS') == -1 or report_text.find('SUMMARY') > report_text.find('OVERALL READINESS')
          - report_text.find('ACTION REQUIRED') == -1 or report_text.find('DETAILED VALIDATION RESULTS') == -1 or report_text.find('ACTION REQUIRED') < report_text.find('DETAILED VALIDATION RESULTS')

    - name: Assert the production report category set
      ansible.builtin.assert:
        that:
          - "'SYSTEM STORAGE NETWORK RKE2 CILIUM LONGHORN'.split() | length == 6"
          - "'SYSTEM STORAGE NETWORK RKE2 CILIUM LONGHORN'.split() | difference(['SYSTEM', 'STORAGE', 'NETWORK', 'RKE2', 'CILIUM', 'LONGHORN']) | length == 0"
          - "'KUBERNETES' not in 'SYSTEM STORAGE NETWORK RKE2 CILIUM LONGHORN'.split()"

    - name: Model exact runtime service and process evidence
      ansible.builtin.set_fact:
        inactive_services: "rke2-server ActiveState=inactive\nkubelet ActiveState=inactive"
        active_k3s_services: "k3s ActiveState=active"
        containerd_processes: "  321 containerd /usr/bin/containerd"
        k3s_processes: "  654 k3s /usr/bin/k3s server"
        k3s_executables: "PID=654 EXECUTABLE=/usr/bin/k3s CMDLINE=/usr/bin/k3s server"

    - name: Derive exact runtime conflict states
      ansible.builtin.set_fact:
        inactive_is_active: "{{ inactive_services is search('(?m)^rke2-server ActiveState=active$') }}"
        containerd_is_conflict: "{{ containerd_processes is search('(?m)^ *[0-9]+ +(k3s|kubelet|rke2|microk8s) ') }}"
        k3s_is_verified_conflict: "{{ active_k3s_services is search('(?m)^k3s ActiveState=active$') and k3s_processes is search('(?m)^ *[0-9]+ +k3s ') }}"

    - name: Assert runtime false positives and genuine conflict evidence
      ansible.builtin.assert:
        that:
          - not inactive_is_active
          - not containerd_is_conflict
          - k3s_is_verified_conflict
          - "'PID=654' in k3s_executables"
          - "'/usr/bin/k3s' in k3s_executables"
          - "'/usr/bin/k3s server' in k3s_executables"

    - name: Model kernel capability states
      ansible.builtin.set_fact:
        loaded_capability: "{{ 'PASS' if 'iscsi_tcp' in 'overlay br_netfilter iscsi_tcp' else 'WARN' }}"
        builtin_capability: "{{ 'PASS' if 'CONFIG_ISCSI_TCP=y' in 'CONFIG_ISCSI_TCP=y' else 'WARN' }}"
        available_unloaded_capability: "{{ 'WARN' if 'iscsi_tcp AVAILABLE=' in 'iscsi_tcp AVAILABLE=/lib/modules/iscsi_tcp.ko' else 'FAIL' }}"
        missing_capability: "{{ 'WARN' if '' == '' else 'PASS' }}"

    - name: Assert kernel capability classification
      ansible.builtin.assert:
        that:
          - loaded_capability == 'PASS'
          - builtin_capability == 'PASS'
          - available_unloaded_capability == 'WARN'
          - missing_capability == 'WARN'

    - name: Model Longhorn role and disk states
      ansible.builtin.set_fact:
        control_plane_longhorn_status: SKIP
        valid_unmounted_disk_status: PASS
        undersized_disk_status: FAIL
        ambiguous_disk_status: WARN
        missing_iscsi_status: WARN
        missing_iscsi_actual: "Not loaded or unavailable"
        empty_data_path_actual: "Not mounted; acceptable before installation"

    - name: Assert Longhorn worker and control-plane behavior
      ansible.builtin.assert:
        that:
          - control_plane_longhorn_status == 'SKIP'
          - valid_unmounted_disk_status == 'PASS'
          - undersized_disk_status == 'FAIL'
          - ambiguous_disk_status == 'WARN'
          - missing_iscsi_status == 'WARN'
          - missing_iscsi_actual != 'Loaded'
          - empty_data_path_actual == 'Not mounted; acceptable before installation'

    - name: Classify Longhorn dedicated-disk evidence cases
      ansible.builtin.set_fact:
        longhorn_disk_cases: "{{ longhorn_disk_cases | default([]) + [case_result] }}"
      vars:
        data_fields: "{{ item.evidence.split() }}"
        data_valid: "{{ data_fields | length >= 3 and data_fields[1] == 'disk' and data_fields[2] is match('^[0-9]+$') }}"
        data_size_bytes: "{{ data_fields[2] | default('0') | int }}"
        configured: "{{ item.device | trim }}"
        case_result:
          name: "{{ item.name }}"
          status: "{{ 'SKIP' if item.role == 'control_plane' else ('PASS' if configured and data_valid and data_size_bytes >= item.required_gb * 1000000000 else ('FAIL' if configured and data_valid else 'WARN')) }}"
          incomplete: "{{ item.role in ['worker', 'backup'] and (not configured or not data_valid) }}"
      loop:
        - { name: control-plane, role: control_plane, device: "", evidence: "", required_gb: 0 }
        - { name: worker-missing, role: worker, device: "", evidence: "", required_gb: 500 }
        - { name: worker-invalid, role: worker, device: /dev/sdb, evidence: "/dev/sdb disk not-a-size", required_gb: 500 }
        - { name: worker-unformatted-unmounted, role: worker, device: /dev/sdb, evidence: "/dev/sdb disk 600000000000", required_gb: 500 }
        - { name: worker-formatted-mounted, role: worker, device: /dev/sdb, evidence: "/dev/sdb disk 600000000000 ext4 /var/lib/longhorn", required_gb: 500 }
        - { name: backup-valid, role: backup, device: /dev/sdc, evidence: "/dev/sdc disk 2000000000000", required_gb: 2000 }

    - name: Assert Longhorn dedicated-disk regression cases
      ansible.builtin.assert:
        that:
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'control-plane') | map(attribute='status') | first) == 'SKIP'
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-missing') | map(attribute='status') | first) == 'WARN'
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-missing') | map(attribute='incomplete') | first | bool)
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-invalid') | map(attribute='status') | first) == 'WARN'
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-invalid') | map(attribute='incomplete') | first | bool)
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-unformatted-unmounted') | map(attribute='status') | first) == 'PASS'
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'worker-formatted-mounted') | map(attribute='status') | first) == 'PASS'
          - (longhorn_disk_cases | selectattr('name', 'equalto', 'backup-valid') | map(attribute='status') | first) == 'PASS'

    - name: Model automatic Longhorn mount and discovery states
      ansible.builtin.set_fact:
        longhorn_automatic_cases:
          - { name: mounted-dedicated-partition, status: PASS, incomplete: false, actual: "/dev/sdb1 ext4 600 GB total 500 GB available persistent=yes" }
          - { name: mounted-os-partition, status: FAIL, incomplete: false, actual: "/dev/sda2 ext4 600 GB total 500 GB available persistent=yes" }
          - { name: mounted-bind-from-os, status: FAIL, incomplete: false, actual: "bind source /var/lib/other" }
          - { name: mounted-unsupported-filesystem, status: FAIL, incomplete: false, actual: "/dev/sdb1 btrfs 600 GB total 500 GB available persistent=yes" }
          - { name: mounted-without-persistence, status: FAIL, incomplete: false, actual: "/dev/sdb1 ext4 600 GB total 500 GB available persistent=no" }
          - { name: mounted-missing-available-space, status: WARN, incomplete: true, actual: "/dev/sdb1 ext4 600 GB total available=unknown" }
          - { name: one-suitable-unused-disk, status: PASS, incomplete: false, actual: "suitable=/dev/sdb:600 GB" }
          - { name: multiple-suitable-unused-disks, status: WARN, incomplete: true, actual: "suitable=/dev/sdb:600 GB, /dev/sdc:700 GB" }
          - { name: all-unused-disks-undersized, status: FAIL, incomplete: false, actual: "undersized=/dev/sdb:400 GB, /dev/sdc:450 GB" }
          - { name: discovery-identity-unknown, status: WARN, incomplete: true, actual: "Automatic disk discovery evidence is incomplete." }
          - { name: explicit-override, status: PASS, incomplete: false, actual: "Override /dev/vdc, 600 GB" }

    - name: Assert automatic Longhorn mount and discovery classifications
      ansible.builtin.assert:
        that:
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-dedicated-partition') | map(attribute='status') | first) == 'PASS'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-os-partition') | map(attribute='status') | first) == 'FAIL'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-bind-from-os') | map(attribute='status') | first) == 'FAIL'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-unsupported-filesystem') | map(attribute='status') | first) == 'FAIL'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-without-persistence') | map(attribute='status') | first) == 'FAIL'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'mounted-missing-available-space') | map(attribute='incomplete') | first | bool)
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'one-suitable-unused-disk') | map(attribute='status') | first) == 'PASS'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'multiple-suitable-unused-disks') | map(attribute='status') | first) == 'WARN'
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'multiple-suitable-unused-disks') | map(attribute='incomplete') | first | bool)
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'all-unused-disks-undersized') | map(attribute='status') | first) == 'FAIL'
          - "'400 GB' in (longhorn_automatic_cases | selectattr('name', 'equalto', 'all-unused-disks-undersized') | map(attribute='actual') | first)"
          - "'450 GB' in (longhorn_automatic_cases | selectattr('name', 'equalto', 'all-unused-disks-undersized') | map(attribute='actual') | first)"
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'discovery-identity-unknown') | map(attribute='incomplete') | first | bool)
          - (longhorn_automatic_cases | selectattr('name', 'equalto', 'explicit-override') | map(attribute='status') | first) == 'PASS'

    - name: Model Longhorn candidate exclusions
      ansible.builtin.set_fact:
        longhorn_excluded_devices:
          - { device: /dev/sda, reason: os-disk }
          - { device: /dev/sdb, reason: mounted }
          - { device: /dev/sdc, reason: swap }
          - { device: /dev/sdd, reason: lvm }
          - { device: /dev/sde, reason: raid }
          - { device: /dev/sdf, reason: existing-filesystem }
          - { device: /dev/sdg, reason: partitions-or-mapped-children }

    - name: Assert Longhorn candidate exclusions are reported
      ansible.builtin.assert:
        that:
          - longhorn_excluded_devices | map(attribute='reason') | list | difference(['os-disk', 'mounted', 'swap', 'lvm', 'raid', 'existing-filesystem', 'partitions-or-mapped-children']) | length == 0
          - longhorn_excluded_devices | length == 7

    - name: Model memory remediation messages
      ansible.builtin.set_fact:
        memory_remediation_cases:
          - { name: pass, status: PASS, explanation: "" }
          - { name: below-tolerance, status: FAIL, explanation: "Increase visible memory; it is below the tolerated minimum." }
          - { name: unavailable, status: WARN, explanation: "Linux-visible memory evidence is unavailable or malformed." }

    - name: Assert memory remediation matches status
      ansible.builtin.assert:
        that:
          - (memory_remediation_cases | selectattr('name', 'equalto', 'pass') | map(attribute='explanation') | first) == ''
          - "'below the tolerated minimum' in (memory_remediation_cases | selectattr('name', 'equalto', 'below-tolerance') | map(attribute='explanation') | first)"
          - "'Within tolerance' not in (memory_remediation_cases | selectattr('name', 'equalto', 'below-tolerance') | map(attribute='explanation') | first)"
          - "'unavailable or malformed' in (memory_remediation_cases | selectattr('name', 'equalto', 'unavailable') | map(attribute='explanation') | first)"

    - name: Model verified versus unverified readiness evidence
      ansible.builtin.set_fact:
        verified_warning:
          status: WARN
          mandatory: true
          applicable: true
          verified: true
          owner: Infrastructure
          incomplete: false
        unverified_requirement:
          status: WARN
          mandatory: true
          applicable: true
          verified: false
          owner: Infrastructure
          incomplete: true
        optional_unverified:
          status: SKIP
          mandatory: false
          applicable: false
          verified: false
          owner: Infrastructure
          incomplete: false

    - name: Assert readiness does not confuse warnings with incomplete evidence
      ansible.builtin.assert:
        that:
          - not (verified_warning.incomplete | bool)
          - unverified_requirement.incomplete | bool
          - not (optional_unverified.incomplete | bool)

    - name: Assert actionable findings preserve complete multiline text
      ansible.builtin.set_fact:
        long_remediation: "Remove or stop the verified incompatible Kubernetes runtime before RKE2 installation; preserve the complete service, PID, executable, and command-line evidence for remediation."

    - name: Render complete multiline actionable finding
      ansible.builtin.set_fact:
        multiline_action: "FAIL — Infrastructure — Existing Kubernetes processes\nEvidence:\n  service: k3s\n  PID: 654\n  executable: /usr/bin/k3s\n  command line: /usr/bin/k3s server\nRemediation:\n  {{ long_remediation }}"

    - name: Assert actionable evidence is not truncated
      ansible.builtin.assert:
        that:
          - "long_remediation in multiline_action"
          - "'PID: 654' in multiline_action"
          - "'/usr/bin/k3s server' in multiline_action"
