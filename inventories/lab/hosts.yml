all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    prerequisites_validation_profile: lab
    prerequisites_requirement_overrides:
      control_plane:
        vcpu: 4
        memory_gib: 8
        os_disk_gb: 50
        data_disk_gb: 0
      worker:
        vcpu: 4
        memory_gib: 8
        os_disk_gb: 32
        data_disk_gb: 20
  children:
    proxmox2_targets:
      children:
        control_plane:
          hosts:
            basel-rke2-1:
              rke2_node_name: basel-rke2-01
              ansible_host: "192.168.50.165"
              ansible_user: "ubuntu"
        worker:
          hosts:
            basel-rke2-2:
              rke2_node_name: basel-rke2-02
              ansible_host: "192.168.50.167"
              ansible_user: "ubuntu"
        backup:
          hosts: {}
